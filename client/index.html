<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Watch torrents together with synchronized video playback" />
    <!--
      Content Security Policy (CSP) meta tag for development mode.
      In production (Electron), CSP is set via HTTP headers in static-server.cjs.
      This meta tag provides additional protection during development.
      
      Note: 'unsafe-inline' is required for Vite HMR in development.
      In production builds, nonces are used instead.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline';
      img-src 'self' blob: data:;
      media-src 'self' blob: http://127.0.0.1:* wss://*.openwebtorrent.com wss://*.webtorrent.dev wss://*.btorrent.xyz;
      connect-src 'self' ws://127.0.0.1:* wss://0.peerjs.com wss://*.openwebtorrent.com wss://*.webtorrent.dev wss://*.btorrent.xyz;
      font-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-src 'none';
      frame-ancestors 'none';
      worker-src 'self' blob:;
    " />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>TorrSyncPlayer — Watch Torrents Together</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
