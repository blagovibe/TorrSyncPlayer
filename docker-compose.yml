# ============================================================
# Docker Compose для TorrSyncPlayer
# ============================================================

version: "3.8"

services:
  # ── Backend сервер ────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: torrplayer-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8889}:8889"
    volumes:
      - backend-data:/app/data
    environment:
      - PORT=8889
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8889/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - torrplayer-network

  # ── Prometheus (опционально) ──────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: torrplayer-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - torrplayer-network
    profiles:
      - monitoring

  # ── Grafana (опционально) ─────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: torrplayer-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    networks:
      - torrplayer-network
    profiles:
      - monitoring

# ── Volumes ─────────────────────────────────────────────────
volumes:
  backend-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ── Networks ────────────────────────────────────────────────
networks:
  torrplayer-network:
    driver: bridge
