# ============================================================
# Docker Compose для TorrSyncPlayer
# ============================================================
# Требуемые переменные окружения (обязательно установить):
#   JWT_SECRET    - секрет для JWT токенов (минимум 32 символа)
#   GRAFANA_PASSWORD - пароль администратора Grafana
#
# Пример:
#   export JWT_SECRET=$(openssl rand -hex 32)
#   export GRAFANA_PASSWORD=$(openssl rand -base64 16)
# ============================================================

services:
  # ── Backend сервер ────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: torrplayer-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8889}:8889"
      - "6060:6060"
    volumes:
      - backend-data:/app/data
    environment:
      - PORT=8889
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET должна быть установлена. Пример: export JWT_SECRET=$(openssl rand -hex 32)}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8889/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - torrplayer-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 128M

  # ── Prometheus (опционально) ──────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: torrplayer-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - torrplayer-network
    profiles:
      - monitoring
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # ── Grafana (опционально) ─────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: torrplayer-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD должна быть установлена. Пример: export GRAFANA_PASSWORD=$(openssl rand -base64 16)}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - torrplayer-network
    profiles:
      - monitoring
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

# ── Volumes ─────────────────────────────────────────────────
volumes:
  backend-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ── Networks ────────────────────────────────────────────────
networks:
  torrplayer-network:
    driver: bridge
