# The dependencies are watched, because a dependency nobody watches is a
# dependency nobody updates — and the version that ships is the version
# somebody looked at.
#
# Two Go modules and the actions the workflows use. The intervals are
# weekly: the project's own rule is that a check which can be skipped proves
# nothing, and a security update that arrives two months late proves the
# same about the gate it went through.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # The v6 line of go-libp2p is not newer than the v0.4x the project
      # uses: it is the same library from before it changed its module path,
      # and "upgrading" to it moves every import and breaks the build. The
      # number is larger, so the updater tries it; the build says no. It
      # says no here instead, once, with the reason written down.
      - dependency-name: github.com/libp2p/go-libp2p
        versions: ["6.x"]

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
