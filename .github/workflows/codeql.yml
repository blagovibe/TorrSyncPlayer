name: "CodeQL"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false

    # One language, not two. The 'cpp' leg built the frontend with CMake, Qt6
    # and libmpv — none of which exist since the Qt client was removed
    # (bug-0070), so that leg had been failing rather than analysing anything.
    # What it used to miss is picked up below: the frontend is Go, and it was
    # never in scope for CodeQL at all, which is about six thousand lines of
    # client code analysed by nothing.
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Build Go (backend)
        working-directory: backend
        run: go build ./...

      # The client builds through cgo and needs GL/X11 headers. Without them the
      # step fails with what looks like a project fault rather than a missing
      # package.
      - name: Build Go (frontend)
        working-directory: frontend
        env:
          CGO_ENABLED: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends -qq \
            libgl1-mesa-dev libx11-dev libxkbcommon-dev libfontconfig1
          go build ./...

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
