name: Long Gates

# The two jobs that never got to finish in CI because every push cancelled
# an in-flight run. They are gates, not information: they judge the same
# build other jobs already verified. They live here so they can run to
# completion without blocking the pipeline, and so pushes to main do not
# kill them. Own concurrency group with cancellation refused; a push queues
# the next run instead of interrupting this one.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: long-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.4'

jobs:
  # ── The living-player gates ─────────────────────────────────────
  # A real mpv under a 90 s budget on a shared runner flakes for
  # runner reasons, not code reasons, and a push used to kill the
  # macOS leg mid-run — three 90 s budgets expired in one window and
  # the 25-person room assembly never finished measuring (bug-0173,
  # bug-0174). These moved here from ci.yml: they judge the same
  # build, they never get cancelled, and red here means the room or
  # the player broke. The list below must stay identical to the
  # `-skip` list in ci.yml ("Run tests").
  room-and-player-gates:
    name: Living Player Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: frontend/go.sum

      - name: Fetch the modules
        shell: bash
        run: .github/scripts/fetch-modules.sh frontend

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev libfontconfig-dev \
            mpv ffmpeg

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install mpv ffmpeg

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mpv ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Host "choco install failed with $LASTEXITCODE — trying once more"
            choco install mpv ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              Write-Error "choco install failed with $LASTEXITCODE"
              exit $LASTEXITCODE
            }
          }

      - name: Put mpv and ffmpeg on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $chocolatey = "$env:ProgramData\chocolatey\lib"
          $roots = "$env:ProgramFiles", "$env:ProgramFiles(x86)"
          foreach ($name in 'mpv', 'ffmpeg') {
            $found = Get-ChildItem -Path $chocolatey -Filter "$name.exe" -Recurse -ErrorAction SilentlyContinue
            if (-not $found) {
              Write-Host "$name is not under chocolatey, looking wider"
              $found = Get-ChildItem -Path $roots -Filter "$name.exe" -Recurse -ErrorAction SilentlyContinue
            }
            if (-not $found) { Write-Error "$name was installed but cannot be found under: $chocolatey or $roots"; exit 1 }
            $best = $found |
              ForEach-Object {
                [pscustomobject]@{ Path = $_.FullName; Dlls = @(Get-ChildItem (Split-Path $_.FullName) -Filter *.dll -File -ErrorAction SilentlyContinue).Count }
              } |
              Sort-Object Dlls -Descending |
              Select-Object -First 1
            $dir = Split-Path $best.Path
            Write-Host "${name}: $dir ($($best.Dlls) DLLs beside it)"
            "$dir" >> $env:GITHUB_PATH
          }

      - name: Run the living-player tests
        shell: bash
        working-directory: frontend
        env:
          FYNE_DRIVER: offscreen
          CGO_ENABLED: '1'
        run: go test -race -timeout 20m -count=1 -run '^(TestRealMpvVolumeRoundTrip|TestRealMpvPlaysWhileTheSourceIsIncomplete|TestRealMpvOpensItsSocket|TestRealMpvPositionBeforePlayingIsZero|TestRealMpvReportsTheFileDuration|TestRealMpvSendsTheHeaderItWasGiven|TestRealMpvLoadsExternalSubtitlesOverAuthenticatedHTTP|TestRealMpvListsAndSwitchesTracks|TestMpvKeepsSayingStalledWhileThePlayerIsPaused|TestTheFollowerObeysTheHostsPause|TestTheFollowerLandsWhereTheHostIs|TestTheFollowerComesBackToTheRoomsPlayState|TestTheRoomStopsForTheOneWhoIsBehind|TestTheRoomIsReleasedWhenTheOneWhoIsBehindIsBack|TestAGuestDoesNotStopTheRoom|TestARoomOfManyIsStillARoom)$' ./...

      # The player tests drive a real mpv over its IPC socket, which on
      # Windows is a named pipe rather than a unix socket. Without this
      # gate, a runner missing mpv would turn every player claim into a
      # skip and stay green.
      - name: Re-run player tests without skipping
        shell: bash
        working-directory: frontend
        env:
          FYNE_DRIVER: offscreen
          CGO_ENABLED: '1'
        run: |
          if go test -run 'TestRealMpv' -v ./internal/player/... | grep -q SKIP; then
            echo "mpv tests were skipped: mpv is missing or not working on ${{ runner.os }}"
            exit 1
          fi

  # ── Mutation testing ──────────────────────────────────────────────────────
  mutation-tests:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Measured 2026-10-19 over exactly this scope: 0.662461 (317 mutants —
      # 210 killed, 107 survived). The 0.49 this replaced came from a run whose
      # scope named packages that no longer existed, so it described a different
      # measurement than the job took. The floor sits just below the real one so
      # ordinary noise does not trip the gate, while a real drop in test quality
      # still fails the job. Raise it as tests are added; never lower it without
      # re-measuring — see DEV.md, "Соглашения по тестам".
      MUTATION_MIN_RATIO: '0.64'
      MUTATION_MIN_PERCENT: 64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Fetch the modules
        run: .github/scripts/fetch-modules.sh backend
      - name: Install go-mutesting
        run: |
          # Pinned: @latest now requires Go >= 1.27, but CI is on $(GO_VERSION).
          # Last revision before the upstream Go 1.27 bump (go.mod says go 1.25.5).
          #
          # Through the script, because installing a tool is a network
          # operation like any other: the checksum database's connection broke
          # mid-tile once, and this job went red for a reason that said
          # nothing about the code it was testing.
          .github/scripts/install-go-tool.sh github.com/avito-tech/go-mutesting/cmd/go-mutesting@v0.0.0-20251226130216-48d0401f00fb

      - name: Run mutation testing (backend)
        working-directory: backend
        run: |
          # Scope: full ./internal/... takes ~2h for a 37% score and blocks the
          # PR. These four packages carry the actual logic; measured 49.5% over
          # exactly this set. The list used to name ./internal/sync and
          # ./internal/p2p as well — packages deleted with the room broker —
          # so it measured something other than what it claimed.
          go-mutesting \
            ./internal/validation/... ./internal/persistence/... \
            ./internal/utils/... ./internal/buffer/... \
            2>&1 | tee mutation.log
          # go-mutesting prints "The mutation score is 0.494964 (...)" — a 0..1 ratio.
          # The old grep looked for "Mutation score: <n>", which never matched, so the
          # threshold was dead code.
          MUTATION_RATIO=$(grep -oiE 'mutation score is [0-9.]+' mutation.log | tail -1 | grep -oE '[0-9.]+$')
          if [ -z "$MUTATION_RATIO" ]; then
            echo "Could not parse mutation score from mutation.log"
            exit 1
          fi
          MUTATION_PERCENT=$(awk "BEGIN { printf \"%.2f\", $MUTATION_RATIO * 100 }")
          echo "Mutation score: $MUTATION_PERCENT%"
          if awk "BEGIN { exit !($MUTATION_RATIO < $MUTATION_MIN_RATIO) }"; then
            echo "Mutation score $MUTATION_PERCENT% is below the ${MUTATION_MIN_PERCENT}% floor"
            exit 1
          fi

  # ── Performance/Load tests ─────────────────────────────────────────────────
  load-tests:
    name: Load Tests (k6)
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Fetch the modules
        run: .github/scripts/fetch-modules.sh backend
      - name: Build backend
        working-directory: backend
        run: make build

      - name: Start backend for load testing
        working-directory: backend
        env:
          # A load generator drives thousands of requests per second from one
          # address; the shipped per-IP limit is 1 req/s (60/min). These raise
          # the ceiling rather than removing the limiter — the same token bucket
          # stays in the request path, and the server logs a warning naming both
          # variables. Change them here, never in defaults.
          API_RATE_LIMIT: '500'
          API_RATE_BURST: '2000'
        run: |
          ./build/torrsyncplayer --port 8889 --auto-tls > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -k -sf https://localhost:8889/health > /dev/null && break
            sleep 1
          done
          curl -k -s https://localhost:8889/health
          echo
          # The access token is generated at startup and printed to the log.
          # The load generator needs it; there is no secret to configure.
          ACCESS_TOKEN=$(grep -oE 'token=[0-9a-f]+' server.log | head -1 | cut -d= -f2)
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::could not read the access token from server.log"
            cat server.log
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Run k6 load tests
        working-directory: tests/load/k6
        run: |
          k6 version
          k6 run --out json=results.json -e ACCESS_TOKEN="$ACCESS_TOKEN" mixed_scenario.js 2>&1

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-results
          path: tests/load/k6/results.json
