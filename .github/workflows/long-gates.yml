name: Long Gates

# The two jobs that never got to finish in CI because every push cancelled
# an in-flight run. They are gates, not information: they judge the same
# build other jobs already verified. They live here so they can run to
# completion without blocking the pipeline, and so pushes to main do not
# kill them. Own concurrency group with cancellation refused; a push queues
# the next run instead of interrupting this one.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: long-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.4'

jobs:
  # ── Mutation testing ──────────────────────────────────────────────────────
  mutation-tests:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Measured 2026-10-19 over exactly this scope: 0.662461 (317 mutants —
      # 210 killed, 107 survived). The 0.49 this replaced came from a run whose
      # scope named packages that no longer existed, so it described a different
      # measurement than the job took. The floor sits just below the real one so
      # ordinary noise does not trip the gate, while a real drop in test quality
      # still fails the job. Raise it as tests are added; never lower it without
      # re-measuring — see DEV.md, "Соглашения по тестам".
      MUTATION_MIN_RATIO: '0.64'
      MUTATION_MIN_PERCENT: 64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Fetch the modules
        run: ${{ github.workspace }}/.github/scripts/fetch-modules.sh backend
      - name: Install go-mutesting
        run: |
          # Pinned: @latest now requires Go >= 1.27, but CI is on $(GO_VERSION).
          # Last revision before the upstream Go 1.27 bump (go.mod says go 1.25.5).
          #
          # Through the script, because installing a tool is a network
          # operation like any other: the checksum database's connection broke
          # mid-tile once, and this job went red for a reason that said
          # nothing about the code it was testing.
          ${{ github.workspace }}/.github/scripts/install-go-tool.sh github.com/avito-tech/go-mutesting/cmd/go-mutesting@v0.0.0-20251226130216-48d0401f00fb

      - name: Run mutation testing (backend)
        working-directory: backend
        run: |
          # Scope: full ./internal/... takes ~2h for a 37% score and blocks the
          # PR. These four packages carry the actual logic; measured 49.5% over
          # exactly this set. The list used to name ./internal/sync and
          # ./internal/p2p as well — packages deleted with the room broker —
          # so it measured something other than what it claimed.
          go-mutesting \
            ./internal/validation/... ./internal/persistence/... \
            ./internal/utils/... ./internal/buffer/... \
            2>&1 | tee mutation.log
          # go-mutesting prints "The mutation score is 0.494964 (...)" — a 0..1 ratio.
          # The old grep looked for "Mutation score: <n>", which never matched, so the
          # threshold was dead code.
          MUTATION_RATIO=$(grep -oiE 'mutation score is [0-9.]+' mutation.log | tail -1 | grep -oE '[0-9.]+$')
          if [ -z "$MUTATION_RATIO" ]; then
            echo "Could not parse mutation score from mutation.log"
            exit 1
          fi
          MUTATION_PERCENT=$(awk "BEGIN { printf \"%.2f\", $MUTATION_RATIO * 100 }")
          echo "Mutation score: $MUTATION_PERCENT%"
          if awk "BEGIN { exit !($MUTATION_RATIO < $MUTATION_MIN_RATIO) }"; then
            echo "Mutation score $MUTATION_PERCENT% is below the ${MUTATION_MIN_PERCENT}% floor"
            exit 1
          fi

  # ── Performance/Load tests ─────────────────────────────────────────────────
  load-tests:
    name: Load Tests (k6)
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Fetch the modules
        run: ${{ github.workspace }}/.github/scripts/fetch-modules.sh backend
      - name: Build backend
        working-directory: backend
        run: make build

      - name: Start backend for load testing
        working-directory: backend
        env:
          # A load generator drives thousands of requests per second from one
          # address; the shipped per-IP limit is 1 req/s (60/min). These raise
          # the ceiling rather than removing the limiter — the same token bucket
          # stays in the request path, and the server logs a warning naming both
          # variables. Change them here, never in defaults.
          API_RATE_LIMIT: '500'
          API_RATE_BURST: '2000'
        run: |
          ./build/torrsyncplayer --port 8889 --auto-tls > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -k -sf https://localhost:8889/health > /dev/null && break
            sleep 1
          done
          curl -k -s https://localhost:8889/health
          echo
          # The access token is generated at startup and printed to the log.
          # The load generator needs it; there is no secret to configure.
          ACCESS_TOKEN=$(grep -oE 'token=[0-9a-f]+' server.log | head -1 | cut -d= -f2)
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::could not read the access token from server.log"
            cat server.log
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Run k6 load tests
        working-directory: tests/load/k6
        run: |
          k6 version
          k6 run --out json=results.json -e ACCESS_TOKEN="$ACCESS_TOKEN" mixed_scenario.js 2>&1

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-results
          path: tests/load/k6/results.json
