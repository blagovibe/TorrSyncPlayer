name: Rendezvous

# A measurement, not a gate.
#
# The rendezvous is the one part of this project whose behaviour belongs to
# someone else's network. Every test that gates a pull request runs against a
# local testbed, because the project's own rule is that a test must not fail for
# someone else's reasons — and that rule is right for a gate and wrong for a
# measurement. This workflow therefore runs the same two participants against
# the public DHT, on a schedule, always finishes successfully, and writes what
# it saw into the job summary.
#
# A check that goes red half the time teaches everyone to ignore red, so this
# one does not decide anything. It is a series, and what it is for is to answer
# questions no single run can: does the room usually meet, how long does it
# take, and does a stretch of failures belong to the public DHT or to us.
#
# It is deliberately its own file rather than a scheduled job inside ci.yml:
# a schedule there would run mutation testing and the contract suite by the
# hour, for a measurement that takes twenty minutes.

on:
  schedule:
    # Every six hours: often enough to see a bad stretch, rare enough that it
    # is not a poll.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  # The series lives in the repository: a measurement that lives in a job
  # summary for fourteen days is a measurement nobody reads, and the threshold
  # below means something only if the runs are kept.
  contents: write
  pull-requests: write

concurrency:
  group: rendezvous-measurement
  cancel-in-progress: false

env:
  # Pinned in every workflow and checked to be the same number everywhere by
  # backend/internal/cicontract: a workflow that quietly builds with a different
  # Go is a green job about a different compiler.
  GO_VERSION: '1.27.2'

jobs:
  measure:
    name: One rendezvous against the public DHT
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: frontend/go.sum

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev libfontconfig-dev mpv ffmpeg

      # The scenario never fails the run. What it prints is the product.
      - name: Measure one rendezvous
        shell: bash
        working-directory: frontend
        env:
          FYNE_DRIVER: offscreen
          CGO_ENABLED: '1'
          TORRSYNC_PUBLIC: '1'
        run: go test -v -timeout 30m -run TestARoomMeetsOverThePublicDHT ./internal/integration/... 2>&1 | tee rendezvous.log

      - name: What it saw
        shell: bash
        run: |
          {
            echo "## The room over the public network"
            echo
            echo '```'
            grep -E '(outcome|waited|waitedSeconds|attempts):' rendezvous.log || echo "(the run produced no reading)"
            echo '```'
            echo
            echo "Runs automatically every six hours; it decides nothing by design."
          } >> "$GITHUB_STEP_SUMMARY"

      # The series is a table in the repository, one row per run, and the
      # threshold is written down: no fewer than 90% of the last 20 runs met
      # within 90 seconds. Below it, a card is opened on the board — the board
      # is files, so a card is a file, and a number nobody chose.
      - name: Record the run in the series
        shell: bash
        run: .github/scripts/rendezvous-series.sh record frontend/rendezvous.log measurements/rendezvous.md

      - name: Check the series against its threshold
        id: threshold
        shell: bash
        run: |
          # A measurement never fails the run: the breach opens a card, and the
          # card is what a person reads.
          if .github/scripts/rendezvous-series.sh check measurements/rendezvous.md "$GITHUB_WORKSPACE"; then
            echo "breached=false" >> "$GITHUB_OUTPUT"
          else
            echo "breached=true" >> "$GITHUB_OUTPUT"
            echo "::warning::the rendezvous series is below its threshold; a card was written for the board"
          fi

      - name: Publish the series
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="measurements/series"
          git fetch origin "$branch" || true
          git checkout -B "$branch" "origin/$branch" 2>/dev/null || git checkout -B "$branch"
          # The board is a directory of cards, and an empty board is not in
          # git at all — so the paths are added wholesale rather than by name.
          git add -A
          if git diff --cached --quiet; then
            echo "the series has nothing new"
            exit 0
          fi
          git commit -m "the room over the public network: one more run"
          git push --force origin "$branch"

          if gh pr list --head "$branch" --state open | grep -q .; then
            echo "the series pull request is already open"
          else
            gh pr create --head "$branch" --base main --title "The room over the public network: the series" --body "The measured series of meetings in the public network. The threshold is written down in DEV.md; a breach opens a card on the board."
          fi

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendezvous-${{ github.run_id }}
          path: frontend/rendezvous.log
          retention-days: 14