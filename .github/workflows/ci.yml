name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: golangci/golangci-lint-action@v6
        with:
          version: "v1.64.8"
          install-mode: "goinstall"
          working-directory: backend

      - name: Run golangci-lint
        working-directory: backend
        run: golangci-lint run --timeout=5m ./...

      - name: Check formatting
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)" || { echo "Code not formatted. Run: gofmt -w ."; exit 1; }

      - name: Check go.mod tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          go mod verify

  test-backend:
    name: Test Backend
    needs: lint-backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run tests with coverage
        working-directory: backend
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: backend
          files: coverage.out
          flags: backend
          fail_ci_if_error: false

  build-backend:
    name: Build Backend (${{ matrix.os }})
    needs: test-backend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: make build

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt6 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev libgl1-mesa-dev \
            libmpv-dev cmake g++

      - name: Configure CMake
        working-directory: frontend
        run: |
          mkdir -p build && cd build
          cmake .. -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        working-directory: frontend/build
        run: make -j$(nproc) 2>&1 || make 2>&1

      - name: Run clang-tidy
        working-directory: frontend
        run: |
          cmake -B build-clang-tidy -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTS=OFF .
          run-clang-tidy -p build-clang-tidy -j$(nproc) 2>&1 || echo "clang-tidy warnings found (non-blocking)"

      - name: Run tests
        working-directory: frontend/build
        run: ctest --output-on-failure -V 2>&1
