name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.12.2"
          install-mode: "binary"
          working-directory: backend
          skip-cache: true

      - name: Run golangci-lint
        working-directory: backend
        run: golangci-lint run --timeout=5m ./...

      - name: Check formatting
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)" || { echo "Code not formatted. Run: gofmt -w ."; exit 1; }

      - name: Check go.mod tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          go mod verify

      - name: Secrets scanning
        uses: gitleaks/gitleaks-action@v2

  test-backend:
    name: Test Backend
    needs: lint-backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run tests with race detector and coverage
        working-directory: backend
        run: |
          CGO_ENABLED=1 go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./... || exit 0  # Report vulnerabilities but don't fail for now

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: backend
          files: coverage.out
          flags: backend
          fail_ci_if_error: false

  build-backend:
    name: Build Backend (${{ matrix.os }})
    needs: test-backend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: make build

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt6 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev libgl1-mesa-dev \
            libmpv-dev cmake g++

      - name: Configure CMake
        working-directory: frontend
        run: |
          mkdir -p build && cd build
          cmake .. -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        working-directory: frontend/build
        run: make -j$(nproc) 2>&1 || make 2>&1

      - name: Run clang-tidy
        if: false  # Temporarily disabled - clang-tidy not installed in runner by default
        working-directory: frontend
        run: |
          if [ -d "build" ]; then
            run-clang-tidy -p build -j$(nproc) -quiet || echo "clang-tidy completed with warnings (non-blocking)"
          else
            echo "Build directory not found, skipping clang-tidy"
          fi

      - name: Run tests
        working-directory: frontend/build
        run: ctest --output-on-failure -V 2>&1

  security-scan:
    name: OWASP ZAP Security Scan
    needs: [test-backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend for scanning
        working-directory: backend
        run: make build

      - name: Start application
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          cd backend
          # Use fallback if JWT_SECRET not set
          export JWT_SECRET=${JWT_SECRET:-test-jwt-secret-key-for-security-scanning-min-32}
          ./build/torrsyncplayer --port 8889 --auto-tls &
          # Wait for server to be ready with timeout and retry
          for i in {1..30}; do
            if curl -k -s https://localhost:8889/health >/dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
          echo "Server startup attempted, proceeding to ZAP scan..."

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://127.0.0.1:8889'
          cmd_options: '-a -config api.addrs.hostname.empty=false -config ssl.ignore.connection.failure=true -config connection.ssl.routable.enabled=false'
        env:
          # Use Docker with host network to access localhost services
          ZAP_OVERRIDEDOCKERNETWORK: 'host'
