name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.3'

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum


      - name: Fetch the modules
        run: ${{ github.workspace }}/.github/scripts/fetch-modules.sh backend
      - name: Run go mod tidy
        working-directory: backend
        run: go mod tidy

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: "v2.14.0"
          install-mode: "binary"
          working-directory: backend
          skip-cache: true

      - name: Run golangci-lint
        working-directory: backend
        run: golangci-lint run --timeout=5m ./...

      # The contract package is behind the `contract` build tag, so neither
      # `go build ./...` nor `go vet ./...` nor `golangci-lint ./...` compiles
      # it. A constructor changed in e2fb119 left `sync.NewService()` unfixed
      # in the pact provider, the Pact job went red, and nothing else in the
      # pipeline noticed. Vet it here so the package cannot rot unseen again.
      - name: Vet the contract package
        working-directory: backend
        run: go vet -tags contract ./...

      - name: Check formatting
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)" || { echo "Code not formatted. Run: gofmt -w ."; exit 1; }

      - name: Check go.mod tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || { echo "go.mod/go.sum not tidy. Run: go mod tidy"; exit 1; }
          go mod verify

      # The same for the frontend, which had no such check: the module's sums
      # drifted and nobody saw it, because nothing ever asked whether they
      # were tidy. The bot that publishes the measurement's row committed the
      # drift — `go mod download all` writes the sums of modules the build
      # does not need, and `go mod tidy` takes them away again.
      - name: Check go.mod tidy (frontend)
        working-directory: frontend
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || { echo "frontend go.mod/go.sum not tidy. Run: go mod tidy"; exit 1; }
          go mod verify

      - name: Check Swagger spec is up to date
        working-directory: backend
        run: |
          # The spec is generated from the annotations in the code. Without this
          # check it rots silently: it once still described WebRTC data channels
          # that had been removed months earlier.
          go run github.com/swaggo/swag/cmd/swag@v1.16.6 \
            init --generalInfo cmd/server/main.go --output docs --parseDependency
          git diff --exit-code docs/ \
            || { echo "Swagger spec is stale. Regenerate with the command above"; exit 1; }

      - name: Secrets scanning
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: .
          base: ""

  test-frontend-go:
    name: Test Frontend (${{ matrix.os }})
    needs: lint-backend
    runs-on: ${{ matrix.os }}

    # fail-fast: false on purpose. One red platform must not cancel the other
    # two: the value of a matrix is that it reports *where* the break is, and a
    # cancelled macos leg tells nobody anything (idea-0072).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: frontend/go.sum

      # Fyne builds through cgo. What that needs differs per platform, and the
      # difference is the point: a header that exists on one runner and not on
      # another is a green matrix that means "checked one platform".
      # Fyne builds through cgo and needs the GL/X11 headers; the player tests
      # drive a real mpv over its IPC socket, and ffmpeg builds the multi-track
      # fixture one of them plays. Without these the suite does not skip — it
      # fails on a missing executable, which is a red job that says nothing about
      # the platform.

      - name: Fetch the modules
        run: ${{ github.workspace }}/.github/scripts/fetch-modules.sh frontend
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev libfontconfig-dev \
            mpv ffmpeg

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install mpv ffmpeg

      # Chocolatey's own exit code, not the exit code of the pipe it used to
      # be written into: `choco install ... | Write-Host` makes a failed
      # install look like a successful one, and the failure surfaces three
      # steps later as "ffmpeg was installed but cannot be found" — which
      # says nothing about chocolatey's error, because it was thrown away.
      # One more attempt, because the package server does fail sometimes
      # and the honest answer is chocolatey's own message, printed.
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mpv ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Host "choco install failed with $LASTEXITCODE — trying once more"
            choco install mpv ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              Write-Error "choco install failed with $LASTEXITCODE"
              exit $LASTEXITCODE
            }
          }

      # Chocolatey does not put mpv on PATH for later steps, and the release
      # job already learned that the hard way. The directory is found and pushed
      # onto PATH here so the suite sees a real mpv and a real ffmpeg.
      - name: Put mpv and ffmpeg on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $roots = "$env:ProgramData\chocolatey\lib", "$env:ProgramFiles", "$env:ProgramFiles(x86)"
          foreach ($name in 'mpv', 'ffmpeg') {
            $found = Get-ChildItem -Path $roots -Filter "$name.exe" -Recurse -ErrorAction SilentlyContinue
            if (-not $found) { Write-Error "$name was installed but cannot be found under: $roots"; exit 1 }
            $best = $found |
              ForEach-Object {
                [pscustomobject]@{ Path = $_.FullName; Dlls = @(Get-ChildItem (Split-Path $_.FullName) -Filter *.dll -File -ErrorAction SilentlyContinue).Count }
              } |
              Sort-Object Dlls -Descending |
              Select-Object -First 1
            $dir = Split-Path $best.Path
            Write-Host "${name}: $dir ($($best.Dlls) DLLs beside it)"
            "$dir" >> $env:GITHUB_PATH
          }

      # The driver must be offscreen: without a display the tests hang waiting
      # for a window rather than failing. That is per-platform too — there is no
      # display on any of these runners, only the shape differs.
      # The timeout is stated: the room and the follower tests wait for a
      # network and for a cold mpv, and the budget they need on a loaded
      # runner is bigger than Go's default of ten minutes per package. A
      # package killed by the default looks like a failure of the code.
      - name: Run tests
        shell: bash
        working-directory: frontend
        env:
          FYNE_DRIVER: offscreen
          CGO_ENABLED: '1'
        run: go test -race -timeout 20m -coverprofile=coverage.out -covermode=atomic ./...

      - name: Report coverage
        shell: bash
        working-directory: frontend
        run: go tool cover -func=coverage.out | tail -1

      # The player tests drive a real mpv over its IPC socket, which on Windows
      # is a named pipe rather than a unix socket — the one piece of this project
      # that has never run anywhere but on the machine it was written on. The
      # no-skip gate is what says so: without it a runner missing mpv would turn
      # every player claim into a skip and stay green.
      - name: Re-run player tests without skipping
        shell: bash
        working-directory: frontend
        env:
          FYNE_DRIVER: offscreen
          CGO_ENABLED: '1'
        run: |
          if go test -run 'TestRealMpv' -v ./internal/player/... | grep -q SKIP; then
            echo "mpv tests were skipped: mpv is missing or not working on ${{ runner.os }}"
            exit 1
          fi

      - name: Build the application
        shell: bash
        working-directory: frontend
        env:
          CGO_ENABLED: '1'
        run: go build ./...

      # The scenario tests start the real backend binary and drive the real
      # client against it. They are the gate for retiring the Qt client, and
      # they need the backend module to build — which is why they run here and
      # not as part of the backend job.
      - name: Run the end-to-end scenario tests
        shell: bash
        working-directory: frontend
        env:
          FYNE_DRIVER: offscreen
          CGO_ENABLED: '1'
        run: go test -v -timeout 10m ./internal/integration/...

  # The room's promise — "the same moment in the same second" — is measured,
  # not asserted by a test that checks a command arrived. This is that
  # measurement: two real players, one real file, one real room over a real
  # libp2p stream, and the difference between the two positions sampled every
  # half second.
  #
  # It is a job of its own, not another leg of the matrix, because it is a
  # measurement rather than a check: it takes two minutes, it says what the
  # room does rather than whether a function returned, and the platform does
  # not change the number — the room's logic is the same everywhere.
  #
  # Two things happen here, and they are different. The measurement itself is
  # the gate: the threshold lives inside it, so a run that broke the promise
  # makes this job red. The series is what no single run can answer — is the
  # divergence growing — and its rows live in the repository, because a
  # measurement that lives in a job summary for fourteen days is a
  # measurement nobody reads (idea-0142, idea-0146).
  sync-measurement:
    name: Sync Divergence Measurement
    needs: lint-backend
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: frontend/go.sum

      - name: Fetch the modules
        run: ${{ github.workspace }}/.github/scripts/fetch-modules.sh frontend

      # The same build dependencies as the other frontend jobs: Fyne builds
      # through cgo, and the measurement drives a real mpv over its socket.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev libfontconfig-dev \
            mpv ffmpeg

      # The gate. A run that broke the promise fails here, and the job is
      # red: this is our code, not the weather, and a promise with nobody
      # checking it is not a promise.
      - name: Measure the room's divergence
        shell: bash
        working-directory: frontend
        env:
          FYNE_DRIVER: offscreen
          CGO_ENABLED: '1'
        run: go test -tags measurement -v -timeout 6m -run TestTheRoomKeepsEveryoneInTheSameSecond ./internal/ui/ 2>&1 | tee sync.log

      - name: What it saw
        if: always()
        shell: bash
        run: |
          {
            echo "## The room's divergence"
            echo
            echo '```'
            grep -E '(steadyDivergence|landingSeconds|samples|outcome):' frontend/sync.log || echo "(the run produced no reading)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The series is a table in the repository, one row per run, and the
      # threshold is written down: no fewer than 90% of the last 20 runs kept
      # the divergence within the promise. The number itself is read out of
      # the measurement, so the series and the gate cannot disagree.
      #
      # The row is recorded even when the run broke the promise: a run that
      # broke it is exactly the row the series is for.
      - name: Record the run in the series
        if: always()
        shell: bash
        run: .github/scripts/sync-series.sh record frontend/sync.log measurements/sync.md frontend/internal/ui/sync_measurement_test.go

      - name: Check the series against its threshold
        if: always()
        shell: bash
        run: |
          # The breach opens a card, and the card is what a person reads. The
          # job is already red when the run itself broke the promise.
          if .github/scripts/sync-series.sh check measurements/sync.md "$GITHUB_WORKSPACE" frontend/internal/ui/sync_measurement_test.go; then
            echo "the series is within its threshold"
          else
            echo "::warning::the sync series is below its threshold; a card was written for the board"
          fi

      # The row and the card land in the repository itself. A pull request
      # would need the repository to allow Actions to open one, and it does
      # not; main is not protected, and a row of measurements is data rather
      # than intent — it needs no review to be true. The commit says [skip ci]
      # so that the measurement does not start a pipeline of its own.
      #
      # Only on a push to main: a pull request's measurement has no business
      # writing to main.
      - name: Publish the series
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The board is a directory of cards, and an empty board is not in
          # git at all — so the paths are added wholesale rather than by name.
          # And only these paths: `git add -A` would sweep in whatever the
          # run touched, and the run touches go.sum — `go mod download all`
          # writes the sums of modules the build does not need.
          git add measurements .project-board
          if git diff --cached --quiet; then
            echo "the series has nothing new"
            exit 0
          fi
          git commit -m "the room's divergence: one more run [skip ci]"

          # The run touched other things — `go mod download all` writes the
          # sums of modules the build does not need — and a rebase refuses to
          # run with a dirty tree. The commit is already made; what is left is
          # the run's own dust.
          git checkout -- .

          # main may have moved under the measurement: the run reads the
          # repository as it was when it started, and the series goes in on
          # top of what is there now.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-${{ github.run_id }}
          path: frontend/sync.log
          retention-days: 14

  room-across-nat:
    name: Room Across NAT
    needs: lint-backend
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write

    # The one scenario that needs privileges: two participants, two network
    # namespaces, one masquerade and one dropped forward rule between them. It
    # answers a question nothing else here can — does the room work when the
    # two sides cannot dial each other — and it is a required job rather than a
    # scheduled one for the same reason the room bugs were: the moment this is
    # optional is the moment it quietly stops running.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: frontend/go.sum


      - name: Fetch the modules
        run: ${{ github.workspace }}/.github/scripts/fetch-modules.sh frontend
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev libfontconfig-dev \
            iproute2 iptables iputils-ping

      # The setup fails loudly on purpose. A scenario that quietly created
      # nothing and passed is the exact failure this repository keeps having to
      # undo, so there is no skip here and no `|| true`: if the namespaces
      # cannot be created, the job is red and says so.
      - name: Set up the namespaces
        run: sudo tests/netns/room-nat.sh up

      # The very first thing the test would otherwise discover for itself, in
      # three identical attempts and forty seconds: the namespaces exist, and
      # the process cannot enter them. Cheap to check, and it turns a confusing
      # permission error into a sentence about permissions.
      - name: Check that a test could enter them
        run: |
          sudo env "PATH=$PATH" ip netns exec ts-host true

      # As root, like the setup. Not a preference: the namespaces are created
      # by root, and entering a network namespace is setns, which needs
      # CAP_SYS_ADMIN over the namespace's owner. The first run of this job
      # failed with «setting the network namespace "ts-host" failed: Operation
      # not permitted» on every attempt — the namespaces were fine, the room
      # never got the chance to be wrong.
      #
      # HOME is passed through so root reuses the runner's module and build
      # caches instead of downloading the world again under /root.
      - name: Run the room across the NAT
        shell: bash
        working-directory: frontend
        run: |
          sudo env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            FYNE_DRIVER=offscreen \
            CGO_ENABLED=1 \
            TORRSYNC_NETNS=1 \
            go test -v -timeout 12m -run TestARoomAcrossNAT ./internal/integration/... 2>&1 | tee nat.log

      # The failure has to be readable to be fixable. This job needs root, two
      # network namespaces and two NAT'd sides — nobody can reproduce it on a
      # laptop, and reading a failed job's log stream needs rights most
      # contributors do not have. So when it fails it says so where anyone can
      # read: an issue, in the open, with the output. A required check that
      # fails silently into a page you cannot open is worse than no check.
      - name: Say what happened, where anyone can read it
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          {
            echo "The room-across-NAT scenario failed on [run ${GITHUB_RUN_ID}](${RUN_URL})."
            echo
            echo "The namespaces were created and torn down successfully, so the room itself"
            echo "did not work across a NAT — or the scenario could not reach it."
            echo
            echo '```'
            tail -c 20000 frontend/nat.log 2>/dev/null || echo "(no log: the step died before writing one)"
            echo '```'
          } > /tmp/nat-body.md
          {
            echo "### What the room did, or did not, do"
            echo
            echo '```'
            tail -c 20000 frontend/nat.log 2>/dev/null || echo "(no log: the step died before writing one)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # No label, and no swallowing the error: `gh issue create --label`
          # fails outright when the label does not exist, and a step that
          # reports a failure by quietly failing to report it is the same
          # failure one layer up.
          gh issue create \
            --title "Room Across NAT failed on run ${GITHUB_RUN_ID}" \
            --body-file /tmp/nat-body.md

      # Always, including after a failure: leaving two namespaces and a
      # masquerade rule behind would shape whatever runs next on the runner.
      - name: Tear down the namespaces
        if: always()
        run: sudo tests/netns/room-nat.sh down

  test-backend:
    name: Test Backend
    needs: lint-backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum


      - name: Fetch the modules
        run: ${{ github.workspace }}/.github/scripts/fetch-modules.sh backend
      - name: Run tests with race detector and coverage
        working-directory: backend
        env:
          # Measured 60.1% statement coverage. The floor sits below it so a
          # single new uncovered file cannot block a PR, while a real erosion of
          # the test suite does. Raise it as tests are added; never lower it
          # without re-measuring.
          COVERAGE_MIN_PERCENT: '55'
        run: |
          set -o pipefail
          CGO_ENABLED=1 go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); print $3 }')
          echo "Total coverage: ${COVERAGE}%"
          if [ -z "$COVERAGE" ]; then
            echo "Could not parse total coverage"
            exit 1
          fi
          if awk "BEGIN { exit !($COVERAGE < $COVERAGE_MIN_PERCENT) }"; then
            echo "Coverage ${COVERAGE}% is below the ${COVERAGE_MIN_PERCENT}% floor"
            exit 1
          fi

      - name: Verify the CI contract (uncached)
        working-directory: backend
        # internal/cicontract reads this very file from disk. A file a test
        # reads is not an input Go knows about, so without -count=1 the result
        # cache can hand back a pass measured against yesterday's workflow.
        run: go test -count=1 ./internal/cicontract/

      - name: Run govulncheck
        working-directory: backend
        # Fail the build on known vulnerabilities. Set GOVULNCHECK_ALLOW_FAILURE=1
        # in the workflow run to temporarily opt out (e.g. during triage).
        #
        # The scan fetches the vulnerability database over the network, and a
        # broken connection to it is the weather, not a finding: the script
        # tells a finding (exit 3) from a failure to look (anything else) and
        # retries only the second, the same way the modules are fetched.
        env:
          GOVULNCHECK_ALLOW_FAILURE: ${{ vars.GOVULNCHECK_ALLOW_FAILURE || '0' }}
        run: |
          ${{ github.workspace }}/.github/scripts/install-go-tool.sh golang.org/x/vuln/cmd/govulncheck@latest
          ${{ github.workspace }}/.github/scripts/govulncheck.sh ./... || [ "${GOVULNCHECK_ALLOW_FAILURE}" = "1" ]

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          directory: backend
          files: coverage.out
          flags: backend
          fail_ci_if_error: false

  build-backend:
    name: Build Backend (${{ matrix.os }})
    needs: test-backend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum


      - name: Fetch the modules
        run: ${{ github.workspace }}/.github/scripts/fetch-modules.sh backend
      - name: Build
        working-directory: backend
        run: make build

  security-scan:
    name: OWASP ZAP Security Scan
    needs: [test-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # This job builds the backend without the toolchain step the others
      # have, so it fetches the modules itself — with the same three
      # attempts, because a broken stream from the proxy must not be able to
      # fail a job that says nothing about the code.
      - name: Fetch the modules
        run: ${{ github.workspace }}/.github/scripts/fetch-modules.sh backend

      - name: Build backend for scanning
        working-directory: backend
        run: make build

      - name: Start application
        run: |
          cd backend
          ./build/torrsyncplayer --port 8889 --auto-tls &
          # Wait for server to be ready with timeout and retry
          for i in {1..30}; do
            if curl -k -s https://localhost:8889/health >/dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
          echo "Server startup attempted, proceeding to ZAP scan..."

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'https://127.0.0.1:8889'
          cmd_options: '-a -config api.addrs.hostname.empty=false -config ssl.ignore.connection.failure=true -config connection.ssl.routable.enabled=false'
        env:
          # Use Docker with host network to access localhost services
          ZAP_OVERRIDEDOCKERNETWORK: 'host'

  # ── Sanitizer tests ──────────────────────────────────────────────────
  # ── Fuzzing tests ────────────────────────────────────────────────────
  fuzz-tests:
    name: Fuzzing Tests
    needs: [test-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum


      - name: Fetch the modules
        run: ${{ github.workspace }}/.github/scripts/fetch-modules.sh backend
      - name: Run Go fuzzing (backend)
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          # Go refuses -fuzz when the pattern matches more than one fuzz
          # target ("will not fuzz, -fuzz matches more than one fuzz test"),
          # so each target is driven explicitly. The list is discovered from
          # the source rather than hardcoded, so adding a FuzzXxx function
          # cannot silently drop out of CI again.
          mapfile -t targets < <(
            grep -hoE '^func (Fuzz[A-Za-z0-9_]+)' internal/validation/*_test.go \
              | sed -E 's/^func //' | sort -u
          )
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "No fuzz targets found in internal/validation" >&2
            exit 1
          fi
          echo "Fuzz targets: ${targets[*]}"
          for t in "${targets[@]}"; do
            echo "=== $t ==="
            go test -run='^$' -fuzz="^${t}$" -fuzztime=30s ./internal/validation/...
          done

      # No C++ fuzzing here. The previous steps installed libFuzzer and ran
      # `make fuzz_*`, but frontend/CMakeLists.txt defines no fuzz target and
      # frontend/tests/fuzz/ does not exist, so the glob matched nothing. The
      # configure step printed "CMake configure failed, skipping C++ fuzz tests"
      # (it never installed Qt6 either) and the build step then died with
      # "No rule to make target 'fuzz_*'". Under `|| true` all of that was a
      # green step with zero coverage.
      #
      # To restore it: add fuzz harnesses under frontend/tests/fuzz/, declare
      # executable targets named fuzz_<name> in CMakeLists.txt, install Qt6 in
      # this job, and re-add the steps. A Qt6-based integration/fuzz entry point
      # is listed as a non-goal in CONCEPT.md — re-check that first.

  # ── Mutation testing ─────────────────────────────────────────────────
  mutation-tests:
    name: Mutation Testing
    needs: [test-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Measured 2026-10-19 over exactly this scope: 0.662461 (317 mutants —
      # 210 killed, 107 survived). The 0.49 this replaced came from a run whose
      # scope named packages that no longer existed, so it described a different
      # measurement than the job took. The floor sits just below the real one so
      # ordinary noise does not trip the gate, while a real drop in test quality
      # still fails the job. Raise it as tests are added; never lower it without
      # re-measuring — see DEV.md, "Соглашения по тестам".
      MUTATION_MIN_RATIO: '0.64'
      MUTATION_MIN_PERCENT: 64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum


      - name: Fetch the modules
        run: ${{ github.workspace }}/.github/scripts/fetch-modules.sh backend
      - name: Install go-mutesting
        run: |
          # Pinned: @latest now requires Go >= 1.27, but CI is on $(GO_VERSION).
          # Last revision before the upstream Go 1.27 bump (go.mod says go 1.25.5).
          #
          # Through the script, because installing a tool is a network
          # operation like any other: the checksum database's connection broke
          # mid-tile once, and this job went red for a reason that said
          # nothing about the code it was testing.
          ${{ github.workspace }}/.github/scripts/install-go-tool.sh github.com/avito-tech/go-mutesting/cmd/go-mutesting@v0.0.0-20251226130216-48d0401f00fb

      - name: Run mutation testing (backend)
        working-directory: backend
        run: |
          # Scope: full ./internal/... takes ~2h for a 37% score and blocks the
          # PR. These four packages carry the actual logic; measured 49.5% over
          # exactly this set. The list used to name ./internal/sync and
          # ./internal/p2p as well — packages deleted with the room broker —
          # so it measured something other than what it claimed.
          go-mutesting \
            ./internal/validation/... ./internal/persistence/... \
            ./internal/utils/... ./internal/buffer/... \
            2>&1 | tee mutation.log
          # go-mutesting prints "The mutation score is 0.494964 (...)" — a 0..1 ratio.
          # The old grep looked for "Mutation score: <n>", which never matched, so the
          # threshold was dead code.
          MUTATION_RATIO=$(grep -oiE 'mutation score is [0-9.]+' mutation.log | tail -1 | grep -oE '[0-9.]+$')
          if [ -z "$MUTATION_RATIO" ]; then
            echo "Could not parse mutation score from mutation.log"
            exit 1
          fi
          MUTATION_PERCENT=$(awk "BEGIN { printf \"%.2f\", $MUTATION_RATIO * 100 }")
          echo "Mutation score: $MUTATION_PERCENT%"
          if awk "BEGIN { exit !($MUTATION_RATIO < $MUTATION_MIN_RATIO) }"; then
            echo "Mutation score $MUTATION_PERCENT% is below the ${MUTATION_MIN_PERCENT}% floor"
            exit 1
          fi


  # ── Contract testing ──────────────────────────────────────────────────
  contract-test-backend:
    name: Contract Test (Backend Provider)
    needs: [test-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum


      - name: Fetch the modules
        run: ${{ github.workspace }}/.github/scripts/fetch-modules.sh backend
      - name: Run Pact provider verification (backend)
        working-directory: backend
        shell: bash
        run: |
          # Download and test in ONE step on purpose. The path used to be written
          # to $GITHUB_ENV in a previous step and referenced as "$PACT_FFI_DIR" in
          # this step's `env:` block — but workflow env values are resolved by the
          # runner before bash runs, so the linker received the literal string
          # "$PACT_FFI_DIR" and failed with "cannot find -lpact_ffi".
          #
          # -tags contract is required: the provider test is behind that build
          # tag, so without it go test reported "no test files" and the old
          # "|| true" turned that into a green job.
          #
          # pipefail is mandatory: `go test ... | tee pact.log` returns tee's exit
          # status, so a failing verification was reported as a passing job.
          set -o pipefail

          FFI_URL="https://github.com/pact-foundation/pact-reference/releases/download/libpact_ffi-${PACT_FFI_VERSION:-v0.4.28}/libpact_ffi-linux-x86_64.so.gz"
          curl -sSL -o libpact_ffi.so.gz "$FFI_URL"
          gunzip -c libpact_ffi.so.gz > libpact_ffi.so

          export PACT_FFI_DIR="$PWD"
          export CGO_LDFLAGS="-L$PACT_FFI_DIR -lpact_ffi"
          export LD_LIBRARY_PATH="$PACT_FFI_DIR"

          go test -v -tags contract -timeout 15m -run PactProvider ./internal/contract/... 2>&1 | tee pact.log

      - name: Upload Pact log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-verification-log
          path: backend/pact.log

  # NOTE: the frontend "contract test" job was removed. It ran
  # `make test_networkmanager_contract test_torrentmanager_contract
  # test_roommanager_contract` and `ctest -R "Contract"`, but none of those
  # targets are defined in frontend/CMakeLists.txt and the filter matched zero
  # tests — so the job had never checked anything. `|| true` kept it green for
  # years; removing the mask made it red, which exposed the dead step.
  # The backend/front-end contract is verified by the Pact provider job above,
  # and NetworkManager's interface contract by test_networkmanager_gmock.

  # ── Integration/E2E tests ────────────────────────────────────────────
  # This job gates again. It was `continue-on-error: true`, so every e2e
  # failure — a broken playback path, a dead SSE feed — reported as a green
  # build. Expect this job to go red on the first run and stay red until the
  # failures it surfaces are actually fixed.
  # The e2e-tests job is gone. Its only steps were the Qt CMake build and
  # ctest; with those removed it started the backend, curled /health and
  # asserted nothing about the client — a green job that could not fail. The
  # end-to-end coverage it stood for now lives in test-frontend-go, which starts
  # the real backend binary and drives the real client against it.
  # ── Performance/Load tests ────────────────────────────────────────────
  load-tests:
    name: Load Tests (k6)
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum


      - name: Fetch the modules
        run: ${{ github.workspace }}/.github/scripts/fetch-modules.sh backend
      - name: Build backend
        working-directory: backend
        run: make build

      - name: Start backend for load testing
        working-directory: backend
        env:
          # A load generator drives thousands of requests per second from one
          # address; the shipped per-IP limit is 1 req/s (60/min). These raise
          # the ceiling rather than removing the limiter — the same token bucket
          # stays in the request path, and the server logs a warning naming both
          # variables. Change them here, never in defaults.
          API_RATE_LIMIT: '500'
          API_RATE_BURST: '2000'
        run: |
          ./build/torrsyncplayer --port 8889 --auto-tls > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -k -sf https://localhost:8889/health > /dev/null && break
            sleep 1
          done
          curl -k -s https://localhost:8889/health
          echo
          # The access token is generated at startup and printed to the log.
          # The load generator needs it; there is no secret to configure.
          ACCESS_TOKEN=$(grep -oE 'token=[0-9a-f]+' server.log | head -1 | cut -d= -f2)
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::could not read the access token from server.log"
            cat server.log
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Run k6 load tests
        working-directory: tests/load/k6
        run: |
          k6 version
          k6 run --out json=results.json -e ACCESS_TOKEN="$ACCESS_TOKEN" mixed_scenario.js 2>&1

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-results
          path: tests/load/k6/results.json
