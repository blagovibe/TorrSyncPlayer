name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run go mod tidy
        working-directory: backend
        run: go mod tidy

      - uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.12.2"
          install-mode: "binary"
          working-directory: backend
          skip-cache: true

      - name: Run golangci-lint
        working-directory: backend
        run: golangci-lint run --timeout=5m ./...

      - name: Check formatting
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)" || { echo "Code not formatted. Run: gofmt -w ."; exit 1; }

      - name: Check go.mod tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || { echo "go.mod/go.sum not tidy. Run: go mod tidy"; exit 1; }
          go mod verify

      - name: Check Swagger spec is up to date
        working-directory: backend
        run: |
          # The spec is generated from the annotations in the code. Without this
          # check it rots silently: it once still described WebRTC data channels
          # that had been removed months earlier.
          go run github.com/swaggo/swag/cmd/swag@v1.16.6 \
            init --generalInfo cmd/server/main.go --output docs --parseDependency
          git diff --exit-code docs/ \
            || { echo "Swagger spec is stale. Regenerate with the command above"; exit 1; }

      - name: Secrets scanning
        uses: trufflesecurity/trufflehog@v3.95.9
        with:
          path: .
          base: ""

  test-backend:
    name: Test Backend
    needs: lint-backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run tests with race detector and coverage
        working-directory: backend
        env:
          # Measured 60.1% statement coverage. The floor sits below it so a
          # single new uncovered file cannot block a PR, while a real erosion of
          # the test suite does. Raise it as tests are added; never lower it
          # without re-measuring.
          COVERAGE_MIN_PERCENT: '55'
        run: |
          set -o pipefail
          CGO_ENABLED=1 go test -v -race -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v 'integration')
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); print $3 }')
          echo "Total coverage: ${COVERAGE}%"
          if [ -z "$COVERAGE" ]; then
            echo "Could not parse total coverage"
            exit 1
          fi
          if awk "BEGIN { exit !($COVERAGE < $COVERAGE_MIN_PERCENT) }"; then
            echo "Coverage ${COVERAGE}% is below the ${COVERAGE_MIN_PERCENT}% floor"
            exit 1
          fi

      - name: Run govulncheck
        working-directory: backend
        # Fail the build on known vulnerabilities. Set GOVULNCHECK_ALLOW_FAILURE=1
        # in the workflow run to temporarily opt out (e.g. during triage).
        env:
          GOVULNCHECK_ALLOW_FAILURE: ${{ vars.GOVULNCHECK_ALLOW_FAILURE || '0' }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || [ "${GOVULNCHECK_ALLOW_FAILURE}" = "1" ]

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: backend
          files: coverage.out
          flags: backend
          fail_ci_if_error: false

  build-backend:
    name: Build Backend (${{ matrix.os }})
    needs: test-backend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: make build

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt6 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev libgl1-mesa-dev \
            libmpv-dev cmake g++ lcov

      - name: Configure CMake (with tests and coverage)
        working-directory: frontend
        run: |
          mkdir -p build && cd build
          cmake .. -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

      - name: Build
        working-directory: frontend/build
        run: make -j$(nproc) 2>&1 || make 2>&1

      - name: Run clang-tidy
        working-directory: frontend
        run: |
          if [ -d "build" ]; then
            run-clang-tidy -p build -j$(nproc) -quiet 2>&1 | tee clang-tidy.log
            if grep -q "^.*: warning:" clang-tidy.log; then
              echo "clang-tidy warnings found"
              exit 1
            fi
          else
            echo "Build directory not found, skipping clang-tidy"
            exit 0
          fi

      - name: Run unit tests (Qt Test)
        working-directory: frontend/build
        run: ctest --output-on-failure -V 2>&1

      - name: Run gmock tests
        if: always()
        working-directory: frontend/build
        run: ctest -R "GMockTest" --output-on-failure -V 2>&1

      - name: Generate frontend coverage
        working-directory: frontend/build
        run: |
          lcov --capture --directory . --output-file coverage.info --no-external
          lcov --ignore-errors unused --remove coverage.info '/usr/*' '*/tests/*' '*/mocks/*' '*/interfaces/*' --output-file coverage.clean.info
          lcov --list coverage.clean.info
          genhtml coverage.clean.info --output-directory coverage_html

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: frontend/build
          files: coverage.clean.info
          flags: frontend
          fail_ci_if_error: false

  security-scan:
    name: OWASP ZAP Security Scan
    needs: [test-backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend for scanning
        working-directory: backend
        run: make build

      - name: Start application
        env:
        run: |
          cd backend
          ./build/torrsyncplayer --port 8889 --auto-tls &
          # Wait for server to be ready with timeout and retry
          for i in {1..30}; do
            if curl -k -s https://localhost:8889/health >/dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
          echo "Server startup attempted, proceeding to ZAP scan..."

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://127.0.0.1:8889'
          cmd_options: '-a -config api.addrs.hostname.empty=false -config ssl.ignore.connection.failure=true -config connection.ssl.routable.enabled=false'
        env:
          # Use Docker with host network to access localhost services
          ZAP_OVERRIDEDOCKERNETWORK: 'host'

  # ── Sanitizer tests ──────────────────────────────────────────────────
  sanitizer-tests:
    name: Sanitizer Tests (ASan/TSan/UBSan)
    needs: [test-backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt6 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev libgl1-mesa-dev \
            libmpv-dev cmake g++ lcov

      - name: Configure CMake with sanitizers
        working-directory: frontend
        run: |
          mkdir -p build && cd build
          cmake .. -DBUILD_TESTS=ON -DENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build with sanitizers
        working-directory: frontend/build
        run: make -j$(nproc) 2>&1 || make 2>&1
        continue-on-error: true

      - name: Run AddressSanitizer tests
        working-directory: frontend/build
        # No `|| true`: that made a red sanitizer run look green in the UI.
        # continue-on-error keeps the step visible without blocking the build —
        # sanitizer results are environment-sensitive and would make CI flaky.
        continue-on-error: true
        run: |
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 ctest -R "ASan" --output-on-failure -V 2>&1

      - name: Run ThreadSanitizer tests
        working-directory: frontend/build
        continue-on-error: true
        run: |
          TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1 ctest -R "TSan" --output-on-failure -V 2>&1

      - name: Run UBSan tests
        working-directory: frontend/build
        continue-on-error: true
        run: |
          ctest -R "UBSan" --output-on-failure -V 2>&1

  # ── Fuzzing tests ────────────────────────────────────────────────────
  fuzz-tests:
    name: Fuzzing Tests
    needs: [test-backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run Go fuzzing (backend)
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          # Go refuses -fuzz when the pattern matches more than one fuzz
          # target ("will not fuzz, -fuzz matches more than one fuzz test"),
          # so each target is driven explicitly. The list is discovered from
          # the source rather than hardcoded, so adding a FuzzXxx function
          # cannot silently drop out of CI again.
          mapfile -t targets < <(
            grep -hoE '^func (Fuzz[A-Za-z0-9_]+)' internal/validation/*_test.go \
              | sed -E 's/^func //' | sort -u
          )
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "No fuzz targets found in internal/validation" >&2
            exit 1
          fi
          echo "Fuzz targets: ${targets[*]}"
          for t in "${targets[@]}"; do
            echo "=== $t ==="
            go test -run='^$' -fuzz="^${t}$" -fuzztime=30s ./internal/validation/...
          done

      # No C++ fuzzing here. The previous steps installed libFuzzer and ran
      # `make fuzz_*`, but frontend/CMakeLists.txt defines no fuzz target and
      # frontend/tests/fuzz/ does not exist, so the glob matched nothing. The
      # configure step printed "CMake configure failed, skipping C++ fuzz tests"
      # (it never installed Qt6 either) and the build step then died with
      # "No rule to make target 'fuzz_*'". Under `|| true` all of that was a
      # green step with zero coverage.
      #
      # To restore it: add fuzz harnesses under frontend/tests/fuzz/, declare
      # executable targets named fuzz_<name> in CMakeLists.txt, install Qt6 in
      # this job, and re-add the steps. A Qt6-based integration/fuzz entry point
      # is listed as a non-goal in CONCEPT.md — re-check that first.

  # ── Mutation testing ─────────────────────────────────────────────────
  mutation-tests:
    name: Mutation Testing
    needs: [test-backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Measured 0.494964 over this exact scope (695 mutants). The floor sits
      # just below it so ordinary noise does not trip the gate, while a real
      # drop in test quality still fails the job. Raise it as tests are added;
      # never lower it without re-measuring — see DEV.md, "Соглашения по тестам".
      MUTATION_MIN_RATIO: '0.49'
      MUTATION_MIN_PERCENT: 49

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install go-mutesting
        run: |
          # Pinned: @latest now requires Go >= 1.27, but CI is on $(GO_VERSION).
          # Last revision before the upstream Go 1.27 bump (go.mod says go 1.25.5).
          go install github.com/avito-tech/go-mutesting/cmd/go-mutesting@v0.0.0-20251226130216-48d0401f00fb

      - name: Run mutation testing (backend)
        working-directory: backend
        run: |
          # Scope: full ./internal/... takes ~2h for a 37% score and blocks the
          # PR. These packages carry the actual logic; measured score 49.5%.
          go-mutesting \
            ./internal/validation/... ./internal/sync/... ./internal/p2p/... \
            ./internal/persistence/... ./internal/utils/... ./internal/buffer/... \
            2>&1 | tee mutation.log
          # go-mutesting prints "The mutation score is 0.494964 (...)" — a 0..1 ratio.
          # The old grep looked for "Mutation score: <n>", which never matched, so the
          # threshold was dead code.
          MUTATION_RATIO=$(grep -oiE 'mutation score is [0-9.]+' mutation.log | tail -1 | grep -oE '[0-9.]+$')
          if [ -z "$MUTATION_RATIO" ]; then
            echo "Could not parse mutation score from mutation.log"
            exit 1
          fi
          MUTATION_PERCENT=$(awk "BEGIN { printf \"%.2f\", $MUTATION_RATIO * 100 }")
          echo "Mutation score: $MUTATION_PERCENT%"
          if awk "BEGIN { exit !($MUTATION_RATIO < $MUTATION_MIN_RATIO) }"; then
            echo "Mutation score $MUTATION_PERCENT% is below the ${MUTATION_MIN_PERCENT}% floor"
            exit 1
          fi

      - name: Install Mull for C++ mutation testing
        run: |
          # Mull is complex to install, skip for now - can be added later
          echo "C++ mutation testing with Mull - placeholder for future implementation"

  # ── Contract testing ──────────────────────────────────────────────────
  contract-test-backend:
    name: Contract Test (Backend Provider)
    needs: [test-backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run Pact provider verification (backend)
        working-directory: backend
        shell: bash
        run: |
          # Download and test in ONE step on purpose. The path used to be written
          # to $GITHUB_ENV in a previous step and referenced as "$PACT_FFI_DIR" in
          # this step's `env:` block — but workflow env values are resolved by the
          # runner before bash runs, so the linker received the literal string
          # "$PACT_FFI_DIR" and failed with "cannot find -lpact_ffi".
          #
          # -tags contract is required: the provider test is behind that build
          # tag, so without it go test reported "no test files" and the old
          # "|| true" turned that into a green job.
          #
          # pipefail is mandatory: `go test ... | tee pact.log` returns tee's exit
          # status, so a failing verification was reported as a passing job.
          set -o pipefail

          FFI_URL="https://github.com/pact-foundation/pact-reference/releases/download/libpact_ffi-${PACT_FFI_VERSION:-v0.4.28}/libpact_ffi-linux-x86_64.so.gz"
          curl -sSL -o libpact_ffi.so.gz "$FFI_URL"
          gunzip -c libpact_ffi.so.gz > libpact_ffi.so

          export PACT_FFI_DIR="$PWD"
          export CGO_LDFLAGS="-L$PACT_FFI_DIR -lpact_ffi"
          export LD_LIBRARY_PATH="$PACT_FFI_DIR"

          go test -v -tags contract -timeout 15m -run PactProvider ./internal/contract/... 2>&1 | tee pact.log

      - name: Upload Pact log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-verification-log
          path: backend/pact.log

  # NOTE: the frontend "contract test" job was removed. It ran
  # `make test_networkmanager_contract test_torrentmanager_contract
  # test_roommanager_contract` and `ctest -R "Contract"`, but none of those
  # targets are defined in frontend/CMakeLists.txt and the filter matched zero
  # tests — so the job had never checked anything. `|| true` kept it green for
  # years; removing the mask made it red, which exposed the dead step.
  # The backend/front-end contract is verified by the Pact provider job above,
  # and NetworkManager's interface contract by test_networkmanager_gmock.

  # ── Integration/E2E tests ────────────────────────────────────────────
  e2e-tests:
    name: End-to-End Tests
    needs: [build-backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build backend
        working-directory: backend
        run: make build

      - name: Start backend server
        working-directory: backend
        run: |
          ./build/torrsyncplayer --port 8889 --auto-tls &
          sleep 5
          curl -k -s https://localhost:8889/health

      - name: Install Qt6 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev libgl1-mesa-dev \
            libmpv-dev cmake g++ lcov

      - name: Configure CMake for E2E
        working-directory: frontend
        run: |
          mkdir -p build && cd build
          cmake .. -DBUILD_TESTS=ON -DBUILD_INTEGRATION_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build integration tests
        working-directory: frontend/build
        run: make -j$(nproc) test_integration 2>&1

      - name: Run Qt headless integration tests
        working-directory: frontend/build
        # The ctest target is registered as "IntegrationTest" in
        # frontend/CMakeLists.txt (add_test(NAME IntegrationTest ...)). The
        # filter used to be "E2E", which matched no test at all: --no-tests=error
        # turned that into a red step, and before that `|| true` made it green
        # while nothing ran. Keep the name in sync with CMakeLists.txt.
        run: |
          QT_QPA_PLATFORM=offscreen ctest -R "IntegrationTest" --no-tests=error --output-on-failure -V 2>&1

      # No Playwright step. tests/e2e/playwright/tests/app.spec.ts drives a web
      # UI — it navigates to https://localhost:8889 and looks for
      # input[name="username"], a .main-window container and a <video> element.
      # TorrSyncPlayer ships no web frontend: the client is a Qt/C++ desktop app
      # and the Go backend serves JSON only (its root route returns
      # {"error":"Route not found"}). The suite could therefore never pass; under
      # `|| true` it was a green step that asserted nothing. The run also failed
      # before reaching any test, because webServer had no ignoreHTTPSErrors and
      # the backend runs with --auto-tls.
      #
      # Keep tests/e2e/playwright/ in the tree for when a web UI exists; re-add
      # the step with webServer.ignoreHTTPSErrors: true and baseURL set to https.

  # ── Performance/Load tests ────────────────────────────────────────────
  load-tests:
    name: Load Tests (k6)
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build backend
        working-directory: backend
        run: make build

      - name: Start backend for load testing
        working-directory: backend
        env:
          # A load generator drives thousands of requests per second from one
          # address; the shipped per-IP limit is 1 req/s (60/min). These raise
          # the ceiling rather than removing the limiter — the same token bucket
          # stays in the request path, and the server logs a warning naming both
          # variables. Change them here, never in defaults.
          API_RATE_LIMIT: '500'
          API_RATE_BURST: '2000'
        run: |
          ./build/torrsyncplayer --port 8889 --auto-tls > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -k -sf https://localhost:8889/health > /dev/null && break
            sleep 1
          done
          curl -k -s https://localhost:8889/health
          echo
          # The access token is generated at startup and printed to the log.
          # The load generator needs it; there is no secret to configure.
          ACCESS_TOKEN=$(grep -oE 'token=[0-9a-f]+' server.log | head -1 | cut -d= -f2)
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::could not read the access token from server.log"
            cat server.log
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Run k6 load tests
        working-directory: tests/load/k6
        run: |
          k6 version
          k6 run --out json=results.json -e ACCESS_TOKEN="$ACCESS_TOKEN" mixed_scenario.js 2>&1

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-results
          path: tests/load/k6/results.json
