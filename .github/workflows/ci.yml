name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.26.3'

jobs:
  # ==========================================
  # Job 1: Build and Test Frontend first (required for Go embed)
  # ==========================================
  build-and-test-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build
  
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ==========================================
  # Job 2: Build and Test Go (depends on frontend build)
  # ==========================================
  build-and-test-go:
    name: Build & Test Go
    runs-on: ubuntu-latest
    needs: build-and-test-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
  
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download Go modules
        run: go mod download

      - name: Tidy Go modules
        run: go mod tidy

      - name: Verify Go modules
        run: go mod verify

      - name: Build Go code
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run Go tests with race detector
        run: go test ./... -race -count=1 -v

  # ==========================================
  # Job 3: Security Scan (depends on frontend build)
  # ==========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Frontend build (required for gosec to avoid embed errors) ---
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # --- Go Security ---
      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec security scan
        run: gosec ./...
        continue-on-error: true

      # --- Frontend Security ---
      - name: Run npm audit (high severity)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true
