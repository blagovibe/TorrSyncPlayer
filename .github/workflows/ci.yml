# ============================================================
# CI Pipeline для TorrSyncPlayer
# Запускается при push и pull_request в ветки main, develop
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Отменяем предыдущие запуски для той же ветки
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------
  # Lint backend код
  # --------------------------------------------------------
  lint-backend:
    name: Линт Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      # Устанавливаем golangci-lint
      - name: Установка golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend

      # Запускаем golangci-lint
      - name: Запуск golangci-lint
        working-directory: backend
        run: golangci-lint run --timeout=5m ./...

  # --------------------------------------------------------
  # Тесты backend с coverage
  # --------------------------------------------------------
  test-backend:
    name: Тесты Backend
    needs: lint-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Запуск тестов с coverage
        working-directory: backend
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Загрузка coverage отчёта
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.*
          retention-days: 7

      - name: Отправка coverage в Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.out
          flags: backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # --------------------------------------------------------
  # Сборка backend на разных платформах
  # --------------------------------------------------------
  build-backend:
    name: Сборка Backend (${{ matrix.os }})
    needs: test-backend
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Сборка backend
        working-directory: backend
        run: make build

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: |
            backend/build/
            backend/bin/
          if-no-files-found: warn
          retention-days: 7

  # --------------------------------------------------------
  # Lint frontend код (clang-tidy)
  # --------------------------------------------------------
  lint-frontend:
    name: Линт Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Устанавливаем системные зависимости
      - name: Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            clang-tidy \
            libmpv-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxcb-xinerama0 \
            libxcb-xinput-dev \
            libxcb-xfixes0-dev

      # Устанавливаем Qt 6.5
      - name: Установка Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.5.*"
          host: "linux"
          target: "desktop"
          arch: "gcc_64"
          modules: "qt5compat qtmultimedia"
          cache: true

      # Запускаем clang-tidy
      - name: Запуск clang-tidy
        working-directory: frontend
        run: |
          clang-tidy src/*.cpp -- \
            -I${Qt6_DIR}/include \
            -I${Qt6_DIR}/include/QtCore \
            -I${Qt6_DIR}/include/QtGui \
            -I${Qt6_DIR}/include/QtWidgets \
            -I${Qt6_DIR}/include/QtNetwork \
            -std=c++17

  # --------------------------------------------------------
  # Сборка frontend на Linux
  # --------------------------------------------------------
  build-frontend-linux:
    name: Сборка Frontend (Linux)
    needs: lint-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libmpv-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxcb-xinerama0 \
            libxcb-xinput-dev \
            libxcb-xfixes0-dev

      - name: Установка Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.5.*"
          host: "linux"
          target: "desktop"
          arch: "gcc_64"
          modules: "qt5compat qtmultimedia"
          cache: true

      - name: Сборка frontend с coverage
        run: |
          cd frontend
          mkdir -p build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON
          ninja

      - name: Запуск тестов C++ с coverage
        working-directory: frontend/build
        run: |
          ctest --output-on-failure
          # Генерация coverage отчёта с lcov
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Загрузка coverage отчёта
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/build/coverage.info
          retention-days: 7

      - name: Отправка coverage в Codecov
        uses: codecov/codecov-action@v4
        with:
          file: frontend/build/coverage.info
          flags: frontend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: frontend-linux
          path: frontend/build/TorrSyncPlayer*
          if-no-files-found: warn
          retention-days: 7

  # --------------------------------------------------------
  # Сборка frontend на Windows
  # --------------------------------------------------------
  build-frontend-windows:
    name: Сборка Frontend (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.5.*"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2019_64"
          modules: "qt5compat qtmultimedia"
          cache: true

      - name: Сборка frontend
        shell: cmd
        run: |
          cd frontend
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64
          cmake --build . --config Release

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: frontend-windows
          path: frontend/build/Release/TorrSyncPlayer*
          if-no-files-found: warn
          retention-days: 7

  # --------------------------------------------------------
  # Coverage проверка для PR
  # --------------------------------------------------------
  coverage-check:
    name: Проверка Coverage
    needs: [test-backend, build-frontend-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Загрузка backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/

      - name: Загрузка frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/build/

      - name: Проверка минимального coverage
        run: |
          # Проверяем backend coverage (минимум 60%)
          BACKEND_COVERAGE=$(go tool cover -func=backend/coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Backend coverage: ${BACKEND_COVERAGE}%"
          if (( $(echo "$BACKEND_COVERAGE < 60" | bc -l) )); then
            echo "❌ Backend coverage ниже 60%: ${BACKEND_COVERAGE}%"
            exit 1
          fi
          echo "✅ Backend coverage достаточный: ${BACKEND_COVERAGE}%"

      - name: Комментарий с coverage в PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          message: |
            ## 📊 Coverage Report
            
            | Component | Coverage |
            |-----------|----------|
            | Backend | [Codecov](https://codecov.io/gh/${{ github.repository }}) |
            | Frontend | [Codecov](https://codecov.io/gh/${{ github.repository }}) |
            
            Coverage отчёты загружены в Codecov.
