name: Diagnostics
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y --no-install-recommends mpv ffmpeg
      - name: Build the fixture the way the test does
        working-directory: frontend
        run: |
          set -eu
          go test -run 'TestNothingXYZ' ./internal/player/ 2>/dev/null || true
          cat > /tmp/build_test.go <<'GO'
          package player
          import "testing"
          func TestDumpFixture(t *testing.T) {
            t.Log("ffmpeg:", mustLookPath(t, "ffmpeg"))
            path := buildMultiTrackFile(t, "ffmpeg")
            t.Log("fixture:", path)
          }
          GO
          cp /tmp/build_test.go internal/player/zz_dump_test.go
          go test -run TestDumpFixture -v ./internal/player/ 2>&1 | grep -E "fixture|ffmpeg" | head -4
      - name: mpv log for the real fixture
        run: |
          set -eu
          FF=$(go run ./cmd/icon -h 2>/dev/null; echo)
          # rebuild the fixture exactly as the test does, then play it with mpv
          mkdir -p /tmp/fx
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "sine=frequency=440:duration=2" \
            -f lavfi -i "sine=frequency=880:duration=2" \
            -f lavfi -i "testsrc=size=64x64:rate=5:duration=2" \
            -map 2:v -map 0:a -map 1:a \
            -c:v libx264 -preset ultrafast -c:a aac \
            -metadata:s:a:0 title=Original -metadata:s:a:1 title=Dub \
            -y /tmp/fx/m.mkv
          printf '1\n00:00:00,000 --> 00:00:01,000\nhello\n\n' > /tmp/fx/s.srt
          ffmpeg -hide_banner -loglevel error -i /tmp/fx/m.mkv -i /tmp/fx/s.srt \
            -map 0 -map 1:s -c copy -y /tmp/fx/final.mkv
          rm -f /tmp/fx/mpv.sock
          mpv --no-config --idle=yes --keep-open=yes --no-input-default-bindings \
            --input-ipc-server=/tmp/fx/mpv.sock /tmp/fx/final.mkv \
            > /tmp/fx/mpv.log 2>&1 &
          sleep 3
          python3 - <<'PY'
          import socket, json, time
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM); s.settimeout(5)
          s.connect('/tmp/fx/mpv.sock'); f = s.makefile('r')
          def cmd(c):
              s.sendall((json.dumps({"command": c}) + "\n").encode())
              return json.loads(f.readline())
          print("playlist-count:", cmd(["get_property", "playlist-count"]))
          r = cmd(["get_property", "track-list"])
          print("track-list error:", r.get("error"))
          for t in r.get("data", []): print("   ", t.get("id"), t.get("type"), t.get("lang"))
          r = cmd(["get_property", "aid"])
          print("aid:", r)
          PY
          echo "--- mpv log ---"; tail -20 /tmp/fx/mpv.log
