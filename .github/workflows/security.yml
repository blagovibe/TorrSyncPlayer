name: Security

env:
  # Single source of truth for the Go version across all workflows, matching
  # ci.yml and release.yml. Keep this in sync with those two by editing only
  # the value here and in the workflow-level `env:` blocks.
  GO_VERSION: '1.27.3'

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 2 AM UTC
  # A weekly-only gate cannot be checked after fixing anything: the finding was
  # fixed, the paths trigger did not change, and the only way to know it is green
  # is to wait until Monday. workflow_dispatch makes it verifiable on demand.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'frontend/**/*.cpp'
      - 'frontend/**/*.h'
  pull_request:
    branches: [main]
    paths:
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'frontend/**/*.cpp'
      - 'frontend/**/*.h'

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod/cache/download
          key: ${{ runner.os }}-govulncheck-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-govulncheck-

      # Through the script, because installing a tool is a network
      # operation like any other, and a broken connection to the checksum
      # database must not be able to fail a scan that says nothing about
      # the code.
      - name: Install govulncheck
        run: ${{ github.workspace }}/.github/scripts/install-go-tool.sh golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: backend
        run: govulncheck ./...

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e # v3.99.3
        with:
          path: ./
          base: ""
          head: ""
          extra_args: "--only-verified"

  # Static security analysis
  #
  # This used to be cppcheck and scan-build over frontend/src/, a directory that
  # has not existed since the Qt client was removed, with `|| echo` swallowing
  # whatever either tool had to say about it (bug-0070). A gate that cannot fail
  # is not a gate, so both tools are gone and the role is taken by gosec, which
  # analyses Go — including the frontend, which nothing was analysing before.
  #
  # This job is deliberately blocking. gosec exits non-zero when it finds
  # something, so the first run may well be red: that is the gate working, not a
  # regression, and the findings get fixed rather than silenced.
  go-security:
    name: Go Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install gosec
        run: ${{ github.workspace }}/.github/scripts/install-go-tool.sh github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec (backend)
        working-directory: backend
        run: |
          "$(go env GOPATH)/bin/gosec" -quiet -fmt=github ./...

      # cgo again: without the GL/X11 headers the client cannot be built, and
      # skipping it would quietly return to analysing half the project.
      - name: Run gosec (frontend)
        working-directory: frontend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends -qq \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev libfontconfig-dev
          CGO_ENABLED=1 "$(go env GOPATH)/bin/gosec" -quiet -fmt=github ./...
