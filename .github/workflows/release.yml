name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  QT_VERSION: '6.8.6'
  GO_VERSION: '1.26'

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libmpv-dev libgl1-mesa-dev \
            libxkbcommon-dev libxcb-cursor0 libfuse2

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Build backend
        working-directory: ./backend
        run: go build -ldflags "-s -w" -o build/torrsyncplayer ./cmd/server

      - name: Build frontend
        working-directory: frontend
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build

      - name: Create AppImage
        run: |
          cd frontend/build
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp TorrSyncPlayer AppDir/usr/bin/
          cp ../../backend/build/torrsyncplayer AppDir/usr/bin/
          cp ../resources/icons/app-icon.png AppDir/usr/share/icons/hicolor/256x256/apps/torrsyncplayer.png
          cat > AppDir/usr/share/applications/torrsyncplayer.desktop << 'EOF'
          [Desktop Entry]
          Name=TorrSyncPlayer
          Exec=TorrSyncPlayer
          Icon=torrsyncplayer
          Type=Application
          Categories=AudioVideo;
          EOF
          export QMAKE=$(which qmake6 || which qmake)
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv TorrSyncPlayer-x86_64.AppImage ../../TorrSyncPlayer-linux-x64.AppImage

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: frontend/TorrSyncPlayer-linux-x64.AppImage
          retention-days: 7

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          cache: true

      - name: Build backend
        working-directory: ./backend
        run: go build -ldflags "-s -w" -o build/torrsyncplayer.exe ./cmd/server

      - name: Build frontend
        working-directory: frontend
        shell: cmd
        run: |
          set PATH=%Qt6_DIR%\bin;%PATH%
          cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DCMAKE_PREFIX_PATH="%Qt6_DIR%"
          cmake --build build

      - name: Deploy and package
        working-directory: frontend/build
        shell: cmd
        run: |
          if not exist TorrSyncPlayer.exe (
            echo ERROR: TorrSyncPlayer.exe not found
            dir /s /b *.exe
            exit 1
          )
          mkdir ..\TorrSyncPlayer-windows-x64 2>nul
          copy TorrSyncPlayer.exe ..\TorrSyncPlayer-windows-x64\
          copy ..\..\backend\build\torrsyncplayer.exe ..\TorrSyncPlayer-windows-x64\
          copy "%Qt6_DIR%\bin\Qt6Core.dll" ..\TorrSyncPlayer-windows-x64\
          copy "%Qt6_DIR%\bin\Qt6Gui.dll" ..\TorrSyncPlayer-windows-x64\
          copy "%Qt6_DIR%\bin\Qt6Widgets.dll" ..\TorrSyncPlayer-windows-x64\
          copy "%Qt6_DIR%\bin\Qt6Network.dll" ..\TorrSyncPlayer-windows-x64\
          copy "%Qt6_DIR%\bin\Qt6Svg.dll" ..\TorrSyncPlayer-windows-x64\
          copy "%Qt6_DIR%\bin\Qt6OpenGL.dll" ..\TorrSyncPlayer-windows-x64\ 2>nul
          copy "%Qt6_DIR%\bin\Qt6OpenGLWidgets.dll" ..\TorrSyncPlayer-windows-x64\ 2>nul
          copy "%Qt6_DIR%\bin\Qt6DBus.dll" ..\TorrSyncPlayer-windows-x64\ 2>nul
          copy "%Qt6_DIR%\bin\libgcc_s_seh-1.dll" ..\TorrSyncPlayer-windows-x64\
          copy "%Qt6_DIR%\bin\libstdc++-6.dll" ..\TorrSyncPlayer-windows-x64\
          copy "%Qt6_DIR%\bin\libwinpthread-1.dll" ..\TorrSyncPlayer-windows-x64\
          mkdir ..\TorrSyncPlayer-windows-x64\platforms 2>nul
          copy "%Qt6_DIR%\plugins\platforms\qwindows.dll" ..\TorrSyncPlayer-windows-x64\platforms\
          mkdir ..\TorrSyncPlayer-windows-x64\imageformats 2>nul
          copy "%Qt6_DIR%\plugins\imageformats\*.dll" ..\TorrSyncPlayer-windows-x64\imageformats\
          mkdir ..\TorrSyncPlayer-windows-x64\iconengines 2>nul
          copy "%Qt6_DIR%\plugins\iconengines\*.dll" ..\TorrSyncPlayer-windows-x64\iconengines\
          mkdir ..\TorrSyncPlayer-windows-x64\styles 2>nul
          copy "%Qt6_DIR%\plugins\styles\*.dll" ..\TorrSyncPlayer-windows-x64\styles\
          mkdir ..\TorrSyncPlayer-windows-x64\tls 2>nul
          copy "%Qt6_DIR%\plugins\tls\*.dll" ..\TorrSyncPlayer-windows-x64\tls\
          dir /s /b ..\TorrSyncPlayer-windows-x64\

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: frontend/TorrSyncPlayer-windows-x64/
          retention-days: 7

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: brew install cmake ninja mpv pkg-config

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Build backend
        working-directory: ./backend
        run: go build -ldflags "-s -w" -o build/torrsyncplayer ./cmd/server

      - name: Build frontend
        working-directory: frontend
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DCMAKE_EXE_LINKER_FLAGS="-L/opt/homebrew/lib"
          cmake --build build

      - name: Create .app bundle and DMG
        run: |
          cd frontend/build
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p TorrSyncPlayer.app/Contents/MacOS
          mkdir -p TorrSyncPlayer.app/Contents/Resources
          mkdir -p TorrSyncPlayer.app/Contents/Frameworks
          cp TorrSyncPlayer TorrSyncPlayer.app/Contents/MacOS/
          cp ../../backend/build/torrsyncplayer TorrSyncPlayer.app/Contents/MacOS/
          cp ../resources/icons/app-icon.png TorrSyncPlayer.app/Contents/Resources/ 2>/dev/null || true
          cat > TorrSyncPlayer.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>TorrSyncPlayer</string>
            <key>CFBundleIdentifier</key>
            <string>com.torrsyncplayer.app</string>
            <key>CFBundleName</key>
            <string>TorrSyncPlayer</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          EOF
          ${QT_ROOT_DIR}/bin/macdeployqt TorrSyncPlayer.app -dmg
          mv TorrSyncPlayer.dmg ../../TorrSyncPlayer-macos-arm64.dmg

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: frontend/TorrSyncPlayer-macos-arm64.dmg
          retention-days: 7

  create-release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: List artifacts
        run: ls -laR artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -exec sha256sum {} \; > SHA256SUMS
          cat SHA256SUMS

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "## Changes in this release" > changelog.md
          echo "" >> changelog.md
          echo "$CHANGES" >> changelog.md
          echo "" >> changelog.md
          echo "## Files" >> changelog.md
          echo "" >> changelog.md
          echo "| Platform | File |" >> changelog.md
          echo "|----------|------|" >> changelog.md
          echo "| Linux x64 | TorrSyncPlayer-linux-x64.AppImage |" >> changelog.md
          echo "| Windows x64 | TorrSyncPlayer-windows-x64/ (portable) |" >> changelog.md
          echo "| macOS ARM64 | TorrSyncPlayer-macos-arm64.dmg |" >> changelog.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: changelog.md
          files: artifacts/**/*
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
