# ============================================================
# Release Pipeline для TorrSyncPlayer
# Запускается при создании тега v* (например, v1.0.0)
# ============================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────────────────
  # Сборка всех компонентов на разных платформах
  # ────────────────────────────────────────────────────────────
  build-all:
    name: Сборка (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact: linux-x64
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Setup Go ──────────────────────────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: backend/go.sum

      # ── Сборка backend ────────────────────────────────────────
      - name: Сборка backend
        working-directory: ./backend
        run: |
          go build -ldflags "-s -w" -o build/torrsyncplayer${{ matrix.platform == 'windows' && '.exe' || '' }} ./cmd/server

      # ── Установка зависимостей (Linux) ────────────────────────
      - name: Установка зависимостей (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libmpv-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxcb-xinerama0 \
            libxcb-xinput-dev \
            libxcb-xfixes0-dev \
            libfuse2

      # ── Установка Qt ──────────────────────────────────────────
      - name: Установка Qt (Linux)
        if: matrix.platform == 'linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.*"
          host: "linux"
          target: "desktop"
          arch: "gcc_64"
          modules: "qt5compat qtmultimedia"
          cache: true

      - name: Установка Qt (Windows)
        if: matrix.platform == 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.*"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2019_64"
          modules: "qt5compat qtmultimedia"
          cache: true

      - name: Установка Qt (macOS)
        if: matrix.platform == 'macos'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.*"
          host: "mac"
          target: "desktop"
          arch: "clang_64"
          modules: "qt5compat qtmultimedia"
          cache: true

      # ── Установка linuxdeployqt ─────────────────────────────────
      - name: Установка linuxdeployqt
        if: matrix.os == 'ubuntu-22.04'
        run: |
          wget -q "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage" -O linuxdeployqt
          chmod +x linuxdeployqt
          sudo mv linuxdeployqt /usr/local/bin/

      # ── Сборка frontend (Linux) ───────────────────────────────
      - name: Сборка frontend (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd frontend
          mkdir -p build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          ninja

      # ── Сборка frontend (Windows) ─────────────────────────────
      - name: Сборка frontend (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          cd frontend
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="%Qt6_DIR%" -DCMAKE_BUILD_TYPE=Release .
          cmake --build . --config Release

          mkdir release\TorrSyncPlayer-windows-x64
          copy Release\TorrSyncPlayer.exe release\TorrSyncPlayer-windows-x64\
          copy ..\bin\torrsyncplayer-backend.exe release\TorrSyncPlayer-windows-x64\

          windeployqt --release --no-translations release\TorrSyncPlayer-windows-x64\TorrSyncPlayer.exe

          cd release
          powershell Compress-Archive -Path TorrSyncPlayer-windows-x64\* -DestinationPath TorrSyncPlayer-windows-x64.zip -Force

      # ── Сборка frontend (macOS) ───────────────────────────────
      - name: Сборка frontend (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd frontend
          mkdir -p build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          ninja

      # ── Создание архива (Linux → AppImage) ────────────────────
      - name: Создание AppImage (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cd frontend

          # Создаём символическую ссылку на qmake
          sudo ln -sf ${{ env.Qt6_DIR }}/bin/qmake /usr/bin/qmake

          # Создаём AppDir структуру
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Копируем бинарники (на Linux бинарник в корне, не в Release/)
          cp build/TorrSyncPlayer AppDir/usr/bin/ 2>/dev/null || cp TorrSyncPlayer AppDir/usr/bin/ 2>/dev/null || cp Release/TorrSyncPlayer AppDir/usr/bin/
          cp ../../backend/cmd/server/torrsyncplayer-backend AppDir/usr/bin/ 2>/dev/null || cp ../../bin/torrsyncplayer-backend AppDir/usr/bin/ 2>/dev/null || echo "Backend binary not found, skipping"

          # Копируем иконку
          cp resources/icons/app-icon.png AppDir/usr/share/icons/hicolor/256x256/apps/torrsyncplayer.png

          # Создаём .desktop файл
          cat > AppDir/usr/share/applications/torrsyncplayer.desktop << EOF
          [Desktop Entry]
          Name=TorrSyncPlayer
          Exec=TorrSyncPlayer
          Icon=torrsyncplayer
          Type=Application
          Categories=AudioVideo;
          EOF

          # Создаём AppImage
          linuxdeployqt AppDir/usr/share/applications/torrsyncplayer.desktop -appimage

          # Переименовываем результат
          mv *.AppImage torrSyncPlayer-linux-x64.AppImage

      # ── Создание архива (macOS → .dmg) ────────────────────────
      - name: Создание .dmg (macOS)
        if: matrix.platform == 'macos'
        run: |
          # Создаём .app bundle
          mkdir -p TorrSyncPlayer.app/Contents/MacOS
          mkdir -p TorrSyncPlayer.app/Contents/Resources
          mkdir -p TorrSyncPlayer.app/Contents/Frameworks

          # Копируем бинарники
          cp backend/build/torrsyncplayer TorrSyncPlayer.app/Contents/MacOS/
          cp frontend/build/TorrSyncPlayer TorrSyncPlayer.app/Contents/MacOS/

          # Копируем иконку
          cp frontend/resources/icons/app-icon.png TorrSyncPlayer.app/Contents/Resources/ 2>/dev/null || true

          # Создаём Info.plist
          cat > TorrSyncPlayer.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>TorrSyncPlayer</string>
            <key>CFBundleIdentifier</key>
            <string>com.torrsyncplayer.app</string>
            <key>CFBundleName</key>
            <string>TorrSyncPlayer</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          EOF

          # Запускаем macdeployqt для копирования зависимостей
          ${Qt6_DIR}/bin/macdeployqt TorrSyncPlayer.app -dmg -verbose=1 2>/dev/null || \
            echo "macdeployqt не удался, создаём DMG вручную"

          # Если macdeployqt не создал DMG, создаём вручную
          if [ ! -f TorrSyncPlayer.dmg ]; then
            # Создаём временную директорию для DMG
            mkdir -p dmg_temp
            cp -R TorrSyncPlayer.app dmg_temp/

            # Создаём символическую ссылку на Applications
            ln -s /Applications dmg_temp/Applications

            # Создаём DMG
            hdiutil create -volname "TorrSyncPlayer" \
              -srcfolder dmg_temp \
              -ov -format UDZO \
              TorrSyncPlayer.dmg

            rm -rf dmg_temp
          fi

          # Переименовываем
          mv TorrSyncPlayer.dmg TorrSyncPlayer-macos-arm64.dmg 2>/dev/null || true

      # ── Загрузка артефакта ────────────────────────────────────
      - name: Загрузка артефакта (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: frontend/torrSyncPlayer-linux-x64.AppImage
          if-no-files-found: warn
          retention-days: 30

      - name: Upload artifact (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: frontend/release/TorrSyncPlayer-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Загрузка артефакта (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: TorrSyncPlayer-macos-arm64.dmg
          if-no-files-found: warn
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Создание GitHub Release
  # ────────────────────────────────────────────────────────────
  create-release:
    name: Создание релиза
    needs: build-all
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Скачивание артефактов
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Генерация changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          echo "## Изменения в этом релизе" > changelog.md
          echo "" >> changelog.md
          echo "$CHANGES" >> changelog.md
          echo "" >> changelog.md
          echo "## Файлы" >> changelog.md
          echo "" >> changelog.md
          echo "| Платформа | Архив |" >> changelog.md
          echo "|-----------|-------|" >> changelog.md
          echo "| Linux x64 | TorrSyncPlayer-linux-x64.AppImage |" >> changelog.md
          echo "| Windows x64 | TorrSyncPlayer-windows-x64.zip |" >> changelog.md
          echo "| macOS ARM64 | TorrSyncPlayer-macos-arm64.dmg |" >> changelog.md

          cat changelog.md

      - name: Создание релиза
        uses: softprops/action-gh-release@v2
        with:
          body_path: changelog.md
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
