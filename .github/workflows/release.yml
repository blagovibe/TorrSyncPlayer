# ============================================================
# Release Pipeline для TorrSyncPlayer
# Запускается при создании тега v* (например, v1.0.0)
# ============================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Сборка всех компонентов на разных платформах
  build-all:
    name: Сборка (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Сборка backend
        working-directory: ./backend
        run: make build

      # Установка зависимостей для Linux
      - name: Установка зависимостей (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libmpv-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxcb-xinerama0 \
            libxcb-xinput-dev \
            libxcb-xfixes0-dev

      - name: Установка Qt (Linux)
        if: matrix.platform == 'linux'
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.5.*"
          host: "linux"
          target: "desktop"
          arch: "gcc_64"
          modules: "qt5compat qtmultimedia"
          cache: true

      # Установка зависимостей для Windows
      - name: Установка Qt (Windows)
        if: matrix.platform == 'windows'
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.5.*"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2019_64"
          modules: "qt5compat qtmultimedia"
          cache: true

      # Установка зависимостей для macOS
      - name: Установка Qt (macOS)
        if: matrix.platform == 'macos'
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.5.*"
          host: "mac"
          target: "desktop"
          arch: "clang_64"
          modules: "qt5compat qtmultimedia"
          cache: true

      # Сборка frontend
      - name: Сборка frontend (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd frontend
          mkdir -p build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja

      - name: Сборка frontend (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd frontend
          mkdir -p build
          cd build
          cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          ninja

      - name: Сборка frontend (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd frontend
          mkdir -p build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja

      # Создание архива
      - name: Создание архива (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release
          cp backend/bin/* release/ 2>/dev/null || cp backend/torrserver* release/ 2>/dev/null || true
          cp frontend/build/TorrSyncPlayer* release/ 2>/dev/null || true
          cd release
          tar -czf ../TorrSyncPlayer-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz .

      - name: Создание архива (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item -Path "backend\bin\*" -Destination release -ErrorAction SilentlyContinue
          Copy-Item -Path "backend\torrserver*" -Destination release -ErrorAction SilentlyContinue
          Copy-Item -Path "frontend\build\TorrSyncPlayer*" -Destination release -ErrorAction SilentlyContinue
          Compress-Archive -Path "release\*" -DestinationPath "TorrSyncPlayer-${{ matrix.platform }}-${{ matrix.arch }}.zip" -Force

      - name: Создание архива (macOS)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p release
          cp backend/bin/* release/ 2>/dev/null || cp backend/torrserver* release/ 2>/dev/null || true
          cp frontend/build/TorrSyncPlayer* release/ 2>/dev/null || true
          cd release
          tar -czf ../TorrSyncPlayer-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz .

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: TorrSyncPlayer-${{ matrix.platform }}-${{ matrix.arch }}.*
          retention-days: 30

  # Создание GitHub Release
  create-release:
    name: Создание релиза
    needs: build-all
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание артефактов
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Генерация changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          echo "## Изменения в этом релизе" > changelog.md
          echo "" >> changelog.md
          echo "$CHANGES" >> changelog.md
          echo "" >> changelog.md
          echo "## Файлы" >> changelog.md
          echo "" >> changelog.md
          echo "| Платформа | Архив |" >> changelog.md
          echo "|-----------|-------|" >> changelog.md
          echo "| Linux x64 | TorrSyncPlayer-linux-x64.tar.gz |" >> changelog.md
          echo "| Windows x64 | TorrSyncPlayer-windows-x64.zip |" >> changelog.md
          echo "| macOS ARM64 | TorrSyncPlayer-macos-arm64.tar.gz |" >> changelog.md
          
          cat changelog.md

      - name: Создание релиза
        uses: softprops/action-gh-release@v1
        with:
          body_path: changelog.md
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
