name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            RELEASE_TAG="${REF#refs/tags/}"
          else
            RELEASE_TAG="push-${{ github.run_id }}-${{ github.run_attempt }}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Create release tag (non-version-tag only)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Automated release for ${{ github.sha }}"
          git push origin "$RELEASE_TAG"

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: TorrSyncPlayer-Linux-AppImage
          path: artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: TorrSyncPlayer-Windows
          path: artifacts/windows

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: true
          files: |
            artifacts/linux/*.AppImage
            artifacts/windows/TorrSyncPlayer*.exe
