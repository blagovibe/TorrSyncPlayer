name: Release

on:
  push:
    tags:
      - 'v*'

env:
  QT_VERSION: '6.8.3'
  GO_VERSION: '1.26.5'

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libmpv-dev libgl1-mesa-dev libgl1-mesa-glx \
            libxkbcommon-dev libxcb-cursor0 libfuse2

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Build backend
        working-directory: ./backend
        run: go build -ldflags "-s -w" -o build/torrsyncplayer ./cmd/server

      - name: Build frontend
        working-directory: frontend
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build

      - name: Create AppImage
        run: |
          cd frontend/build
          LINUXDEPLOY_VERSION="1-alpha-20240828-1"
          BASE_URL="https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous"
          PLUGIN_URL="https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous"

          wget "${BASE_URL}/linuxdeploy-x86_64.AppImage" || { echo "Failed to download linuxdeploy"; exit 1; }
          chmod +x linuxdeploy-x86_64.AppImage

          # Download and make plugin executable
          wget "${PLUGIN_URL}/linuxdeploy-plugin-qt-x86_64.AppImage" || { echo "Failed to download linuxdeploy-plugin-qt"; exit 1; }
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp TorrSyncPlayer AppDir/usr/bin/
          cp ../../backend/build/torrsyncplayer AppDir/usr/bin/
          chmod +x AppDir/usr/bin/torrsyncplayer AppDir/usr/bin/TorrSyncPlayer
          cp ../resources/icons/app-icon.png AppDir/usr/share/icons/hicolor/256x256/apps/torrsyncplayer.png 2>/dev/null || true
          cat > AppDir/usr/share/applications/torrsyncplayer.desktop << 'EOF'
          [Desktop Entry]
          Name=TorrSyncPlayer
          Exec=TorrSyncPlayer
          Icon=torrsyncplayer
          Type=Application
          Categories=AudioVideo;
          EOF
          export QMAKE=$(which qmake6 || which qmake)
          export LDAI_OUTPUT=TorrSyncPlayer
          export QT_QPA_PLATFORM=offscreen
          echo "=== Running linuxdeploy ==="
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run -e AppDir/usr/bin/TorrSyncPlayer --appdir AppDir --plugin qt --output appimage 2>&1 || { echo "linuxdeploy failed with exit code $?"; ls -la; exit 1; }
          echo "=== Checking for AppImage ==="
          # appimagetool creates file without .AppImage extension by default
          # Need to add extension and make it executable
          if [ -f TorrSyncPlayer-x86_64.AppImage ]; then
              mv TorrSyncPlayer-x86_64.AppImage ../../TorrSyncPlayer-linux-x64.AppImage
          elif [ -f "TorrSyncPlayer" ] && [ ! -f TorrSyncPlayer-x86_64.AppImage ]; then
              # Rename to proper AppImage name (appimagetool creates file without extension)
              mv TorrSyncPlayer ../../TorrSyncPlayer-linux-x64.AppImage
          elif [ -f TorrSyncPlayer.AppImage ]; then
              mv TorrSyncPlayer.AppImage ../../TorrSyncPlayer-linux-x64.AppImage
          else
              echo "AppImage not found, listing all files:"; ls -la
              exit 1
          fi

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: TorrSyncPlayer-linux-x64.AppImage
          retention-days: 7

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true
          setup-python: false

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Create embedded directory
        run: New-Item -ItemType Directory -Force -Path frontend/build/embedded
        shell: pwsh

      - name: Build backend
        working-directory: ./backend
        run: go build -ldflags "-s -w -H windowsgui" -o ../frontend/build/embedded/torrsyncplayer.exe ./cmd/server
        shell: pwsh

      - name: Compute backend SHA256
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 frontend/build/embedded/torrsyncplayer.exe).Hash.ToLower()
          echo "EMBEDDED_HASH=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "Backend SHA256: $hash"
        shell: pwsh

      - name: Build frontend (with embedded backend)
        working-directory: frontend
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF `
            -DEMBED_BACKEND=ON -DEMBED_BACKEND_PATH="${{ github.workspace }}/frontend/build/embedded/torrsyncplayer.exe" `
            -DEMBED_BACKEND_SHA256="$env:EMBEDDED_HASH"
          cmake --build build
        shell: pwsh

      - name: Deploy Qt runtime and package
        working-directory: frontend/build
        run: |
          windeployqt --release TorrSyncPlayer.exe 2>&1
          Remove-Item -Recurse -Force translations -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force qml -ErrorAction SilentlyContinue
          Remove-Item -Force *.pdb -ErrorAction SilentlyContinue
          cd ..
          Compress-Archive -Path build/TorrSyncPlayer.exe,build/*.dll,build/platforms,build/styles,build/imageformats,build/iconengines -DestinationPath TorrSyncPlayer-windows-x64.zip -Force
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: frontend/TorrSyncPlayer-windows-x64.zip
          retention-days: 7

  build-macos:
    name: Build (macOS)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          brew install cmake ninja pkg-config
          brew install mpv 2>/dev/null || echo "mpv install failed — building without mpv support"

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Build backend
        working-directory: ./backend
        run: go build -ldflags "-s -w" -o build/torrsyncplayer ./cmd/server

      - name: Build frontend
        working-directory: frontend
        run: |
          brew uninstall --ignore-dependencies mpv 2>/dev/null || true
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH}"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DCMAKE_DISABLE_FIND_PACKAGE_MPV=ON
          cmake --build build

      - name: Create .app bundle and DMG
        run: |
          cd frontend/build
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p TorrSyncPlayer.app/Contents/MacOS
          mkdir -p TorrSyncPlayer.app/Contents/Resources
          cp TorrSyncPlayer TorrSyncPlayer.app/Contents/MacOS/
          cp ../../backend/build/torrsyncplayer TorrSyncPlayer.app/Contents/MacOS/
          cp ../resources/icons/app-icon.png TorrSyncPlayer.app/Contents/Resources/ 2>/dev/null || true
          ${QT_ROOT_DIR}/bin/macdeployqt TorrSyncPlayer.app -dmg
          mv TorrSyncPlayer.dmg ../../TorrSyncPlayer-macos-arm64.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: TorrSyncPlayer-macos-arm64.dmg
          retention-days: 7

  create-release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*.zip' \) | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "## \\[" ver "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Warning: no release notes found for v${VERSION} in CHANGELOG.md" >&2
            echo "Release $(VERSION)" > release-notes.md
          fi
          echo "Notes:"
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            artifacts/*.AppImage
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/SHA256SUMS
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}