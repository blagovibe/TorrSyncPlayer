name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  GO_VERSION: '1.24'
  WAILS_VERSION: 'v2.9.2'
  NODE_VERSION: '20'
  APP_NAME: 'TorrSyncPlayer'

jobs:
  # ============================================
  # Windows Portable Build
  # ============================================
  build-windows:
    name: Build Windows (amd64) Portable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install MinGW (GCC for Windows)
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
          echo "CC=C:\msys64\mingw64\bin\gcc.exe" >> $env:GITHUB_ENV

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Get release version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) {
            $tag = "${{ inputs.tag }}"
          }
          if (-not $tag) {
            $tag = "v0.0.0-dev"
          }
          $version = $tag -replace '^v', ''
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Build portable EXE
        run: |
          wails build `
            -portable `
            -platform windows/amd64 `
            -ldflags "-X main.version=${{ steps.version.outputs.version }}" `
            -o ${{ env.APP_NAME }}-windows-portable.exe

      - name: Verify build output
        shell: pwsh
        run: |
          $exePath = "build/bin/${{ env.APP_NAME }}-windows-portable.exe"
          if (Test-Path $exePath) {
            $size = (Get-Item $exePath).Length / 1MB
            echo "✅ Build successful: $exePath ($size MB)"
          } else {
            # Try alternative path
            $exePath = "${{ env.APP_NAME }}-windows-portable.exe"
            if (Test-Path $exePath) {
              $size = (Get-Item $exePath).Length / 1MB
              echo "✅ Build successful: $exePath ($size MB)"
            } else {
              echo "❌ Build output not found"
              Get-ChildItem -Recurse -Filter "*.exe" | Select-Object FullName
              exit 1
            }
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-portable
          path: |
            build/bin/${{ env.APP_NAME }}-windows-portable.exe
            ${{ env.APP_NAME }}-windows-portable.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            build/bin/${{ env.APP_NAME }}-windows-portable.exe
            ${{ env.APP_NAME }}-windows-portable.exe

  # ============================================
  # Linux Build
  # ============================================
  build-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            build-essential \
            libappindicator3-dev \
            librsvg2-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Get release version
        id: version
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag="${{ inputs.tag }}"
          fi
          if [ -z "$tag" ]; then
            tag="v0.0.0-dev"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Version: $version"

      - name: Build Linux binary
        run: |
          wails build \
            -platform linux/amd64 \
            -ldflags "-X main.version=${{ steps.version.outputs.version }}" \
            -o ${{ env.APP_NAME }}-linux-amd64

      - name: Create AppImage structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          cp build/bin/${{ env.APP_NAME }}-linux-amd64 AppDir/usr/bin/${{ env.APP_NAME }}
          chmod +x AppDir/usr/bin/${{ env.APP_NAME }}
          
          cat > AppDir/usr/share/applications/${{ env.APP_NAME }}.desktop << EOF
          [Desktop Entry]
          Name=TorrSyncPlayer
          Exec=${{ env.APP_NAME }}
          Icon=${{ env.APP_NAME }}
          Type=Application
          Categories=AudioVideo;Player;
          Comment=P2P synchronized video player via torrent protocol
          EOF
          
          cp AppDir/usr/share/applications/${{ env.APP_NAME }}.desktop AppDir/
          
          # Create a simple icon placeholder if not exists
          if [ ! -f "build/appicon.png" ]; then
            # Create a simple colored PNG using Python (usually available)
            python3 -c "
          import struct, zlib
          def create_png(width, height, r, g, b):
              def chunk(chunk_type, data):
                  c = chunk_type + data
                  crc = struct.pack('>I', zlib.crc32(c) & 0xffffffff)
                  return struct.pack('>I', len(data)) + c + crc
              header = b'\\x89PNG\\r\\n\\x1a\\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
              raw = b''
              for y in range(height):
                  raw += b'\\x00' + bytes([r, g, b]) * width
              idat = chunk(b'IDAT', zlib.compress(raw))
              iend = chunk(b'IEND', b'')
              return header + ihdr + idat + iend
          with open('AppDir/usr/share/icons/hicolor/256x256/apps/${{ env.APP_NAME }}.png', 'wb') as f:
              f.write(create_png(256, 256, 0, 120, 215))
          " 2>/dev/null || touch AppDir/usr/share/icons/hicolor/256x256/apps/${{ env.APP_NAME }}.png
          else
            cp build/appicon.png AppDir/usr/share/icons/hicolor/256x256/apps/${{ env.APP_NAME }}.png
            cp build/appicon.png AppDir/${{ env.APP_NAME }}.png
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux-amd64
          path: build/bin/${{ env.APP_NAME }}-linux-amd64
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: build/bin/${{ env.APP_NAME }}-linux-amd64

  # ============================================
  # macOS Build (Intel)
  # ============================================
  build-macos-amd64:
    name: Build macOS (amd64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Xcode Command Line Tools
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Get release version
        id: version
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag="${{ inputs.tag }}"
          fi
          if [ -z "$tag" ]; then
            tag="v0.0.0-dev"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Version: $version"

      - name: Build macOS amd64 binary
        run: |
          wails build \
            -platform darwin/amd64 \
            -ldflags "-X main.version=${{ steps.version.outputs.version }}" \
            -o ${{ env.APP_NAME }}-macos-amd64

      - name: Upload macOS amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos-amd64
          path: build/bin/${{ env.APP_NAME }}-macos-amd64
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: build/bin/${{ env.APP_NAME }}-macos-amd64

  # ============================================
  # macOS Build (Apple Silicon)
  # ============================================
  build-macos-arm64:
    name: Build macOS (arm64)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Xcode Command Line Tools
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Download Go modules
        run: go mod download

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Get release version
        id: version
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag="${{ inputs.tag }}"
          fi
          if [ -z "$tag" ]; then
            tag="v0.0.0-dev"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Version: $version"

      - name: Build macOS arm64 binary
        run: |
          wails build \
            -platform darwin/arm64 \
            -ldflags "-X main.version=${{ steps.version.outputs.version }}" \
            -o ${{ env.APP_NAME }}-macos-arm64

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos-arm64
          path: build/bin/${{ env.APP_NAME }}-macos-arm64
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: build/bin/${{ env.APP_NAME }}-macos-arm64

  # ============================================
  # Create Universal macOS Binary (optional)
  # ============================================
  create-macos-universal:
    name: Create macOS Universal Binary
    needs: [build-macos-amd64, build-macos-arm64]
    runs-on: macos-15
    if: github.event_name == 'release'
    steps:
      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos-amd64
          path: amd64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos-arm64
          path: arm64

      - name: Create universal binary
        run: |
          lipo -create \
            amd64/${{ env.APP_NAME }}-macos-amd64 \
            arm64/${{ env.APP_NAME }}-macos-arm64 \
            -output ${{ env.APP_NAME }}-macos-universal

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ env.APP_NAME }}-macos-universal
