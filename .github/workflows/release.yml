name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.27.2'

# Every step here fails the job. A release workflow that swallows errors does
# not publish a broken application — it publishes nothing and reports success,
# which is the failure mode this file was rewritten to end (bug-0070): the
# previous version was entirely Qt, so every job died on `cmake` and `make
# release` had been tagging into a red pipeline for a whole session.

jobs:
  build-linux:
    name: Build (Linux, AppImage)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: frontend/go.sum

      # Fyne builds through cgo and needs GL/X11 headers; mpv is shipped inside
      # the image, so it is installed here to be packaged from.
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev libfontconfig-dev \
            mpv desktop-file-utils file fuse3

      - name: Build the application and the backend
        working-directory: frontend
        env:
          CGO_ENABLED: '1'
        run: go run ./cmd/build -out ../dist

      # The mark is drawn in code (internal/ui.IconPNG) and rendered here, so
      # the icon in the package cannot drift from the icon in the tray.
      - name: Render the icon
        working-directory: frontend
        run: go run ./cmd/icon -size 256 -out ../dist/torrsyncplayer.png

      - name: Assemble the AppDir
        run: |
          set -eu
          APPDIR="dist/AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp dist/TorrSyncPlayer dist/torrsyncplayer "$APPDIR/usr/bin/"
          cp "$(command -v mpv)" "$APPDIR/usr/bin/mpv"
          cp dist/torrsyncplayer.png "$APPDIR/torrsyncplayer.png"
          cp dist/torrsyncplayer.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/torrsyncplayer.png"

          cat > "$APPDIR/torrsyncplayer.desktop" <<'EOF'
          [Desktop Entry]
          Name=TorrSyncPlayer
          Comment=Torrent player with synchronised watch parties
          Exec=TorrSyncPlayer
          Icon=torrsyncplayer
          Type=Application
          Categories=AudioVideo;Player;Network;
          EOF

          # A .desktop file that does not validate is a menu entry that does not
          # appear, and that failure looks like "the application has no icon".
          desktop-file-validate "$APPDIR/torrsyncplayer.desktop"

          # AppRun is what makes the image runnable without installation: it
          # points the loader at the libraries linuxdeploy put in usr/lib.
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/TorrSyncPlayer" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

      # linuxdeploy copies each executable's shared libraries and wires up the
      # runtime hooks. No plugin is used: there is no Qt here any more, and the
      # Qt plugin was the reason every job in this file used to fail.
      #
      # The paths are paths, not names: linuxdeploy checks `fs::exists` on every
      # -e argument and exits 1 otherwise, and `TorrSyncPlayer`/`mpv` are not in
      # the working directory — the binaries sit in dist/ (both of them: mpv was
      # copied into the AppDir above). A bare name made this step fail with
      # "No such file or directory" before a single library was bundled.
      - name: Deploy the libraries and build the AppImage
        run: |
          set -eu
          BASE_URL="https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous"
          wget -q "${BASE_URL}/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage

          # TorrSyncPlayer (Fyne, cgo) and mpv are both deployed: mpv is shipped
          # inside the image, so its codec libraries have to travel with it.
          #
          # verbosity is a number, not a word: 0=debug, 1=info, 2=warning,
          # 3=error. Passing `error` here made the argument parser reject it and
          # print the whole help text — which is how the first real run of this
          # workflow failed, and why it was worth running it on a tag first.
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir dist/AppDir \
            -e dist/TorrSyncPlayer \
            -e dist/AppDir/usr/bin/mpv \
            --output appimage \
            --verbosity 3

          test -f dist/TorrSyncPlayer-x86_64.AppImage \
            || test -f dist/TorrSyncPlayer.AppImage \
            || { echo "no AppImage was produced"; ls -la dist; exit 1; }

      # The image existing is not the same as the image containing anything.
      # Extracting it and looking is the cheapest check that catches an empty
      # or malformed package before a person downloads it.
      - name: Check the image actually contains the application
        run: |
          set -eu
          APPIMAGE=$(ls dist/*.AppImage | head -1)
          rm -rf /tmp/squashfs-root
          ( cd /tmp && "$OLDPWD/$APPIMAGE" --appimage-extract >/dev/null )
          for f in TorrSyncPlayer torrsyncplayer mpv AppRun torrsyncplayer.desktop; do
            test -e "/tmp/squashfs-root/usr/bin/$f" || test -e "/tmp/squashfs-root/$f" || {
              echo "the image is missing $f"; ls -la /tmp/squashfs-root /tmp/squashfs-root/usr/bin; exit 1; }
          done
          test -s /tmp/squashfs-root/usr/lib || {
            echo "the image carries no libraries; it would only run on this runner"; exit 1; }
          du -sh /tmp/squashfs-root

      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: dist/*.AppImage
          retention-days: 7

  build-windows:
    name: Build (Windows, zip)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: frontend/go.sum

      # mpv is shipped beside the application rather than installed on the
      # machine: the point of the zip is that unzipping it is the installation.
      #
      # Nothing here may depend on PATH. The chocolatey package installs mpv
      # without adding it to PATH, and the only thing that resolves on PATH right
      # after an install is `mpv.com` in the package's tools directory — a
      # launcher stub with no DLLs beside it. That is how the first real run of
      # this workflow failed: the install step succeeded by finding the stub,
      # and the assemble step found nothing at all.
      - name: Install mpv
        shell: pwsh
        run: |
          choco install mpv -y --no-progress
          $stub = Get-Command mpv -ErrorAction SilentlyContinue
          if ($stub) { Write-Host "on PATH: $($stub.Source) (a stub, not what we ship)" }

      - name: Build the application and the backend
        working-directory: frontend
        shell: pwsh
        run: go run ./cmd/build -out ../dist

      - name: Assemble the release folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'bundle'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null

          Copy-Item dist/TorrSyncPlayer.exe,dist/torrsyncplayer.exe $bundle

          # mpv is chosen by what the directory holds, not by what PATH says:
          # the directory with the player in it has the DLLs beside it, and the
          # stub's directory has none. `mpv.exe` is the real executable; `mpv.com`
          # is a shim that would ship a launcher without a player.
          $roots = 'C:\ProgramData\chocolatey\lib', "$env:ProgramFiles", "${env:ProgramFiles(x86)}"
          $mpvDir = $null
          $best = 0
          foreach ($root in $roots) {
            Get-ChildItem -Path $root -Filter mpv.exe -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              $dir = Split-Path $_.FullName
              $dlls = @(Get-ChildItem -Path $dir -Filter *.dll -File -ErrorAction SilentlyContinue).Count
              if ($dlls -gt $best) { $best = $dlls; $mpvDir = $dir }
            }
          }
          if (-not $mpvDir) {
            Write-Error "mpv was installed but no directory holding mpv.exe with its DLLs was found under: $roots"
            exit 1
          }
          Write-Host "mpv: $mpvDir ($best DLLs beside it)"

          Get-ChildItem $mpvDir -File |
            Where-Object { $_.Extension -in '.exe','.dll','.txt','.json','.conf' } |
            Copy-Item -Destination $bundle

          Set-Content -Path "$bundle/READ ME FIRST.txt" -Encoding utf8 -Value @'
          TorrSyncPlayer
          ==============

          Unzip anywhere and run TorrSyncPlayer.exe.

          The application starts its own backend on a free port and needs no
          installation, no service and no account. mpv ships beside it, so
          nothing has to be installed for playback either.
          '@

          Compress-Archive -Path "$bundle/*" -DestinationPath TorrSyncPlayer-windows-x64.zip -Force

      - name: Check the archive contains the application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $entries = (Expand-Archive TorrSyncPlayer-windows-x64.zip -DestinationPath /tmp/unpacked -PassThru).FullName
          foreach ($f in 'TorrSyncPlayer.exe','torrsyncplayer.exe','mpv.exe') {
            if (-not ($entries | Where-Object { $_ -like "*$f" })) {
              Write-Error "the archive is missing $f"; $entries; exit 1
            }
          }
          Write-Host "archive entries: $($entries.Count)"

      - name: Upload the Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: TorrSyncPlayer-windows-x64.zip
          retention-days: 7

  build-macos:
    name: Build (macOS, DMG)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: frontend/go.sum

      - name: Install mpv
        run: brew install mpv

      - name: Build the application and the backend
        working-directory: frontend
        env:
          CGO_ENABLED: '1'
        run: go run ./cmd/build -out ../dist

      - name: Render the icon
        working-directory: frontend
        run: go run ./cmd/icon -size 256 -out ../dist/torrsyncplayer.png

      - name: Assemble the .app bundle
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          APP="dist/TorrSyncPlayer.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp dist/TorrSyncPlayer dist/torrsyncplayer "$APP/Contents/MacOS/"
          # Homebrew's mpv is a symlink into the Cellar; the real file is what
          # has to travel, or the bundle points at a prefix the user does not have.
          cp -L "$(command -v mpv)" "$APP/Contents/MacOS/mpv"
          cp dist/torrsyncplayer.png "$APP/Contents/Resources/torrsyncplayer.png"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>TorrSyncPlayer</string>
            <key>CFBundleDisplayName</key><string>TorrSyncPlayer</string>
            <key>CFBundleIdentifier</key><string>com.blagovibe.torrsyncplayer</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>TorrSyncPlayer</string>
            <key>CFBundleIconFile</key><string>torrsyncplayer.png</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

      # An unsigned app is quarantined by Gatekeeper on first launch. Saying so
      # in the release notes is better than a user meeting a blank refusal.
      - name: Sign the bundle ad-hoc
        run: codesign --force --deep --sign - dist/TorrSyncPlayer.app

      - name: Build the DMG
        run: |
          set -eu
          hdiutil create -volname "TorrSyncPlayer" -srcfolder dist/TorrSyncPlayer.app \
            -ov -format UDZO TorrSyncPlayer-macos-arm64.dmg
          test -s TorrSyncPlayer-macos-arm64.dmg

      - name: Check the image actually contains the application
        run: |
          set -eu
          hdiutil attach TorrSyncPlayer-macos-arm64.dmg -nobrowse -mountpoint /tmp/torrsync-dmg
          for f in TorrSyncPlayer torrsyncplayer mpv; do
            test -x "/tmp/torrsync-dmg/TorrSyncPlayer.app/Contents/MacOS/$f" || {
              echo "the image is missing $f"; ls -la /tmp/torrsync-dmg/TorrSyncPlayer.app/Contents/MacOS; exit 1; }
          done
          hdiutil detach /tmp/torrsync-dmg

      - name: Upload the macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: TorrSyncPlayer-macos-arm64.dmg
          retention-days: 7

  create-release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*.zip' \) | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"

          # One awk, one job: print the section for a version. `found && /^## /`
          # is what stops it at the next heading — without that it would print
          # the whole file after the first match.
          #
          # Every pattern is anchored at the start of the line. Unanchored, a
          # prose line that merely quotes a heading — and this journal quotes its
          # own headings constantly, including the one about this very step —
          # would start the extraction mid-sentence and publish the middle of
          # somebody's paragraph as the release notes.
          section() {
            awk -v ver="$1" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              $0 ~ "^## \\[v" ver "\\]" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          }

          section "$VERSION" > release-notes.md || true

          # A tag has no section of its own until somebody writes one, and the
          # convention this file follows (Keep a Changelog) is that [Unreleased]
          # holds exactly what is about to ship. Publishing the fallback note
          # instead would throw away every line of the release, which is the
          # whole reason the notes exist.
          if [ ! -s release-notes.md ]; then
            echo "No [${VERSION}] section in CHANGELOG.md, using [Unreleased]" >&2
            {
              echo "Release ${VERSION} — notes below are the [Unreleased] section:"
              echo "the changelog has no [${VERSION}] section for this tag."
              echo
              section "Unreleased"
            } > release-notes.md
          fi

          echo "Notes:"
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            artifacts/*.AppImage
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/SHA256SUMS
          # A tag carrying a suffix (v1.2.0-rc.1) is not a finished release, and
          # two things follow from that. It is marked as a pre-release, and it is
          # left as a draft: the artifacts are built and attached, but nobody can
          # see them until somebody looks at them and publishes. Publishing an rc
          # as a full release would tell the world it is stable, which is the one
          # thing an rc is not.
          draft: ${{ contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}