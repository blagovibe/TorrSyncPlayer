# ============================================================
# Release Pipeline для TorrSyncPlayer
# Запускается при создании тега v* (например, v1.0.0)
# ============================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────────────────
  # Сборка всех компонентов на разных платформах
  # ────────────────────────────────────────────────────────────
  build-all:
    name: Сборка (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact: linux-x64
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: macos-13
            platform: macos
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Setup Go ──────────────────────────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: backend/go.sum

      # ── Сборка backend ────────────────────────────────────────
      - name: Сборка backend
        working-directory: ./backend
        run: |
          go build -ldflags "-s -w" -o build/torrsyncplayer${{ matrix.platform == 'windows' && '.exe' || '' }} ./cmd/server

      # ── Установка зависимостей (Linux) ────────────────────────
      - name: Установка зависимостей (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libmpv-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxcb-xinerama0 \
            libxcb-xinput-dev \
            libxcb-xfixes0-dev \
            libfuse2

      # ── Установка Qt ──────────────────────────────────────────
      - name: Установка Qt (Linux)
        if: matrix.platform == 'linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          host: "linux"
          target: "desktop"
          arch: "gcc_64"
          cache: true
          modules: "qtbase qtsvg qtimageformats"
          set-env: true

      - name: Setup Qt (MinGW)
        if: matrix.platform == 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          tools: 'tools_mingw'
          modules: "qtbase qtsvg qtimageformats"
          set-env: true

      - name: Установка Qt (macOS)
        if: matrix.platform == 'macos'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          host: "mac"
          target: "desktop"
          arch: "clang_64"
          cache: true
          modules: "qtbase qtsvg qtimageformats"
          set-env: true

      # ── Установка linuxdeployqt ─────────────────────────────────
      - name: Установка linuxdeployqt
        if: matrix.os == 'ubuntu-22.04'
        run: |
          wget -q "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage" -O linuxdeployqt
          chmod +x linuxdeployqt
          sudo mv linuxdeployqt /usr/local/bin/

      # ── Сборка frontend (Linux) ───────────────────────────────
      - name: Сборка frontend (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd frontend
          mkdir -p build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          ninja

      # ── Сборка frontend (Windows, static MinGW) ──────────────
      - name: Build frontend (Windows, static)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          cd frontend

          # Добавляем MinGW и Qt в PATH
          $mingwPath = "$env:Qt6_DIR\..\..\Tools\mingw1320_64\bin"
          if (-not (Test-Path $mingwPath)) {
            $toolsDir = "$env:Qt6_DIR\..\..\Tools"
            $mingwDirs = Get-ChildItem -Path $toolsDir -Directory -Filter "mingw*" -ErrorAction SilentlyContinue
            if ($mingwDirs.Count -gt 0) {
              $mingwPath = Join-Path $mingwDirs[0].FullName "bin"
            }
          }
          $env:PATH = "$env:Qt6_DIR\bin;$mingwPath;$env:PATH"
          Write-Host "Using MinGW from: $mingwPath"

          # Конфигурируем со статической линковкой
          cmake -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" `
            -DCMAKE_CXX_FLAGS="-static" `
            -DBUILD_TESTS=OFF `
            .

          # Собираем
          cmake --build . -j4

          # Проверяем что backend существует
          $backendPath = "..\backend\build\torrsyncplayer.exe"
          if (Test-Path $backendPath) {
            Copy-Item $backendPath -Destination .
            Write-Host "Backend binary copied successfully"
          } else {
            Write-Error "Backend binary not found at $backendPath"
            exit 1
          }

          # Переименовываем frontend exe
          if (Test-Path TorrSyncPlayer.exe) {
            Rename-Item TorrSyncPlayer.exe TorrSyncPlayer-portable.exe -Force
          } else {
            Write-Error "Frontend binary not found"
            exit 1
          }

      # ── Сборка frontend (macOS) ───────────────────────────────
      - name: Сборка frontend (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd frontend
          mkdir -p build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          ninja

      # ── Создание архива (Linux → AppImage) ────────────────────
      - name: Создание AppImage (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cd frontend

          # Создаём символическую ссылку на qmake
          sudo ln -sf ${{ env.Qt6_DIR }}/bin/qmake /usr/bin/qmake

          # Создаём AppDir структуру
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Копируем бинарники
          # Frontend собирается в frontend/build/TorrSyncPlayer
          # Backend собирается в backend/build/torrsyncplayer
          # Текущая директория: frontend/
          FRONTEND_BIN="build/TorrSyncPlayer"
          BACKEND_BIN="../backend/build/torrsyncplayer"

          if [ -f "$FRONTEND_BIN" ]; then
            cp "$FRONTEND_BIN" AppDir/usr/bin/TorrSyncPlayer
            echo "Frontend binary copied"
          else
            echo "ERROR: Frontend binary not found at $FRONTEND_BIN"
            ls -la build/ 2>/dev/null || echo "build/ directory does not exist"
            exit 1
          fi

          if [ -f "$BACKEND_BIN" ]; then
            cp "$BACKEND_BIN" AppDir/usr/bin/torrsyncplayer
            echo "Backend binary copied"
          else
            echo "WARNING: Backend binary not found at $BACKEND_BIN, skipping"
          fi

          # Копируем иконку
          cp resources/icons/app-icon.png AppDir/usr/share/icons/hicolor/256x256/apps/torrsyncplayer.png

          # Создаём .desktop файл
          cat > AppDir/usr/share/applications/torrsyncplayer.desktop << EOF
          [Desktop Entry]
          Name=TorrSyncPlayer
          Exec=TorrSyncPlayer
          Icon=torrsyncplayer
          Type=Application
          Categories=AudioVideo;
          EOF

          # Создаём AppImage
          linuxdeployqt AppDir/usr/share/applications/torrsyncplayer.desktop -appimage

          # Переименовываем результат
          mv *.AppImage torrSyncPlayer-linux-x64.AppImage

      # ── Создание архива (macOS → .dmg) ────────────────────────
       - name: Создание .dmg (macOS)
         if: matrix.platform == 'macos'
         run: |
           # Проверяем что бинарники существуют
           BACKEND_BIN="backend/build/torrsyncplayer"
           FRONTEND_BIN="frontend/build/TorrSyncPlayer"

           if [ ! -f "$BACKEND_BIN" ]; then
             echo "ERROR: Backend binary not found at $BACKEND_BIN"
             ls -la backend/build/ 2>/dev/null || echo "backend/build/ directory does not exist"
             exit 1
           fi

           if [ ! -f "$FRONTEND_BIN" ]; then
             echo "ERROR: Frontend binary not found at $FRONTEND_BIN"
             ls -la frontend/build/ 2>/dev/null || echo "frontend/build/ directory does not exist"
             exit 1
           fi

           # Extract version from git tag
           VERSION=${GITHUB_REF_NAME#v}

           # Создаём .app bundle
           mkdir -p TorrSyncPlayer.app/Contents/MacOS
           mkdir -p TorrSyncPlayer.app/Contents/Resources
           mkdir -p TorrSyncPlayer.app/Contents/Frameworks

           # Копируем бинарники
           cp "$BACKEND_BIN" TorrSyncPlayer.app/Contents/MacOS/torrsyncplayer
           cp "$FRONTEND_BIN" TorrSyncPlayer.app/Contents/MacOS/TorrSyncPlayer

           # Копируем иконку
           cp frontend/resources/icons/app-icon.png TorrSyncPlayer.app/Contents/Resources/ 2>/dev/null || true

           # Создаём Info.plist with dynamic version
           cat > TorrSyncPlayer.app/Contents/Info.plist << EOF
           <?xml version="1.0" encoding="UTF-8"?>
           <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
           <plist version="1.0">
           <dict>
             <key>CFBundleExecutable</key>
             <string>TorrSyncPlayer</string>
             <key>CFBundleIdentifier</key>
             <string>com.torrsyncplayer.app</string>
             <key>CFBundleName</key>
             <string>TorrSyncPlayer</string>
             <key>CFBundleVersion</key>
             <string>${VERSION}</string>
             <key>CFBundlePackageType</key>
             <string>APPL</string>
             <key>LSMinimumSystemVersion</key>
             <string>11.0</string>
           </dict>
           </plist>
           EOF

          # Запускаем macdeployqt для копирования зависимостей
          ${{ env.Qt6_DIR }}/bin/macdeployqt TorrSyncPlayer.app -dmg -verbose=1 2>/dev/null || \
            echo "macdeployqt не удался, создаём DMG вручную"

          # Если macdeployqt не создал DMG, создаём вручную
          if [ ! -f TorrSyncPlayer.dmg ]; then
            # Создаём временную директорию для DMG
            mkdir -p dmg_temp
            cp -R TorrSyncPlayer.app dmg_temp/

            # Создаём символическую ссылку на Applications
            ln -s /Applications dmg_temp/Applications

            # Создаём DMG
            hdiutil create -volname "TorrSyncPlayer" \
              -srcfolder dmg_temp \
              -ov -format UDZO \
              TorrSyncPlayer.dmg

            rm -rf dmg_temp
          fi

          # Переименовываем
          mv TorrSyncPlayer.dmg TorrSyncPlayer-macos-arm64.dmg 2>/dev/null || true

      # ── Загрузка артефакта ────────────────────────────────────
      - name: Загрузка артефакта (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: frontend/torrSyncPlayer-linux-x64.AppImage
          if-no-files-found: warn
          retention-days: 30

      - name: Upload artifact (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: frontend/TorrSyncPlayer-portable.exe
          if-no-files-found: error
          retention-days: 30

      - name: Загрузка артефакта (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: TorrSyncPlayer-macos-arm64.dmg
          if-no-files-found: warn
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Smoke test before release
  # ────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    needs: build-all
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Verify artifacts exist
        run: |
          ls -la artifacts/
          test -f artifacts/torrSyncPlayer-linux-x64.AppImage || echo "WARNING: Linux artifact missing"

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: artifacts/SHA256SUMS
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Создание GitHub Release
  # ────────────────────────────────────────────────────────────
  create-release:
    name: Создание релиза
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Скачивание артефактов
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Генерация changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          echo "## Изменения в этом релизе" > changelog.md
          echo "" >> changelog.md
          echo "$CHANGES" >> changelog.md
          echo "" >> changelog.md
          echo "## Файлы" >> changelog.md
          echo "" >> changelog.md
          echo "| Платформа | Архив |" >> changelog.md
          echo "|-----------|-------|" >> changelog.md
          echo "| Linux x64 | TorrSyncPlayer-linux-x64.AppImage |" >> changelog.md
          echo "| Windows x64 | TorrSyncPlayer-portable.exe |" >> changelog.md
          echo "| macOS ARM64 | TorrSyncPlayer-macos-arm64.dmg |" >> changelog.md

          cat changelog.md

      - name: Создание релиза
        uses: softprops/action-gh-release@v2
        with:
          body_path: changelog.md
          files: artifacts/*
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
