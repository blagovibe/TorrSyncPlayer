name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      confirm_ci_passed:
        description: 'CI must pass before running this workflow'
        required: true
        default: 'confirmed'

env:
  QT_VERSION: '6.8.3'
  GO_VERSION: '1.26'

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libmpv-dev libgl1-mesa-dev \
            libxkbcommon-dev libxcb-cursor0 libfuse2

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Build backend
        working-directory: ./backend
        run: go build -ldflags "-s -w" -o build/torrsyncplayer ./cmd/server

      - name: Build frontend
        working-directory: frontend
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build

      - name: Create AppImage
        env:
          LINUXDEPLOY_SHA256: "8b7c0a8c5d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7"
          LINUXDEPLOY_QT_SHA256: "9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b"
        run: |
          cd frontend/build
          LINUXDEPLOY_VERSION="1.20250109"
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage"
          echo "${LINUXDEPLOY_SHA256}  linuxdeploy-x86_64.AppImage" | sha256sum --check || { echo "linuxdeploy checksum mismatch"; exit 1; }
          chmod +x linuxdeploy-x86_64.AppImage
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-plugin-qt-x86_64.AppImage"
          echo "${LINUXDEPLOY_QT_SHA256}  linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum --check || { echo "linuxdeploy-plugin-qt checksum mismatch"; exit 1; }
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp TorrSyncPlayer AppDir/usr/bin/
          cp ../../backend/build/torrsyncplayer AppDir/usr/bin/
          cp ../resources/icons/app-icon.png AppDir/usr/share/icons/hicolor/256x256/apps/torrsyncplayer.png
          cat > AppDir/usr/share/applications/torrsyncplayer.desktop << 'EOF'
          [Desktop Entry]
          Name=TorrSyncPlayer
          Exec=TorrSyncPlayer
          Icon=torrsyncplayer
          Type=Application
          Categories=AudioVideo;
          EOF
          export QMAKE=$(which qmake6 || which qmake)
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv TorrSyncPlayer-x86_64.AppImage ../../TorrSyncPlayer-linux-x64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: TorrSyncPlayer-linux-x64.AppImage
          retention-days: 7

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Create embedded directory
        run: New-Item -ItemType Directory -Force -Path frontend/build/embedded
        shell: pwsh

      - name: Build backend
        working-directory: ./backend
        run: go build -ldflags "-s -w -H windowsgui" -o ../frontend/build/embedded/torrsyncplayer.exe ./cmd/server
        shell: pwsh

      - name: Compute backend SHA256
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 frontend/build/embedded/torrsyncplayer.exe).Hash.ToLower()
          echo "EMBEDDED_HASH=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "Backend SHA256: $hash"
        shell: pwsh

      - name: Build frontend (with embedded backend)
        working-directory: frontend
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF `
            -DEMBED_BACKEND=ON -DEMBED_BACKEND_PATH="${{ github.workspace }}/frontend/build/embedded/torrsyncplayer.exe" `
            -DEMBED_BACKEND_SHA256="$env:EMBEDDED_HASH"
          cmake --build build
        shell: pwsh

      - name: Upload portable EXE
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: frontend/build/TorrSyncPlayer.exe
          retention-days: 7

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: brew install cmake ninja mpv pkg-config

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Build backend
        working-directory: ./backend
        run: go build -ldflags "-s -w" -o build/torrsyncplayer ./cmd/server

      - name: Build frontend
        working-directory: frontend
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build

      - name: Create .app bundle and DMG
        run: |
          cd frontend/build
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p TorrSyncPlayer.app/Contents/MacOS
          mkdir -p TorrSyncPlayer.app/Contents/Resources
          cp TorrSyncPlayer TorrSyncPlayer.app/Contents/MacOS/
          cp ../../backend/build/torrsyncplayer TorrSyncPlayer.app/Contents/MacOS/
          cp ../resources/icons/app-icon.png TorrSyncPlayer.app/Contents/Resources/ 2>/dev/null || true
          ${QT_ROOT_DIR}/bin/macdeployqt TorrSyncPlayer.app -dmg
          mv TorrSyncPlayer.dmg ../../TorrSyncPlayer-macos-arm64.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: TorrSyncPlayer-macos-arm64.dmg
          retention-days: 7

  create-release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' \) | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "## Changes in this release" > changelog.md
          echo "" >> changelog.md
          echo "$CHANGES" >> changelog.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: changelog.md
          files: |
            artifacts/*.AppImage
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/SHA256SUMS
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
