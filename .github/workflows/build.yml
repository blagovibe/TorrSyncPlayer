name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: 22

jobs:
  checks:
    name: Client checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Web build
        run: npm run build

  build:
    name: Electron ${{ matrix.artifact_name }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: TorrSyncPlayer-Linux-AppImage
            build_command: npm run electron:build:linux
            artifact_path: client/release/*.AppImage
          - os: windows-latest
            artifact_name: TorrSyncPlayer-Windows
            build_command: npm run electron:build:win
            artifact_path: client/release/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Type check
        run: npm run type-check

      - name: Build Electron artifact
        run: ${{ matrix.build_command }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
