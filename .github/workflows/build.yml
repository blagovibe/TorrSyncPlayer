name: Build TorrSyncPlayer

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  # ---------- Linux (AppImage) ----------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev librsvg2-dev patchelf libssl-dev

      - name: Install Rust & Tauri (Linux)
        uses: tauri-apps/action@v0
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install Node.js & npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Clean node_modules
        run: rm -rf client/node_modules

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: client
        run: npm run build

      - name: Build AppImage with Tauri
        working-directory: client
        env:
          TAURI_PLATFORM: linux
        run: |
          cargo tauri build --bundles appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrSyncPlayer-AppImage
          path: client/src-tauri/target/release/bundle/appimage/*.AppImage

  # ---------- Windows (portable EXE) ----------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust & Tauri (Windows)
        uses: tauri-apps/action@v0
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install Node.js & npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Clean node_modules
        run: rm -rf client/node_modules

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: client
        run: npm run build

      - name: Build portable EXE with Tauri
        working-directory: client
        env:
          TAURI_PLATFORM: windows
        run: |
          cargo tauri build --bundles app

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrSyncPlayer-EXE
          path: client/src-tauri/target/release/bundle/app/*.exe

