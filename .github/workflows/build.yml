name: Build TorrSyncPlayer

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26.3'
  WAILS_VERSION: 'v2.9.2'
  NODE_VERSION: '20'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install MinGW (GCC for Windows)
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config

      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
          echo "CC=C:\msys64\mingw64\bin\gcc.exe" >> $env:GITHUB_ENV

      - name: Install Wails CLI
        env:
          CGO_ENABLED: 1
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Download Go modules
        run: go mod download

      - name: Clean Go cache
        run: |
          go clean -modcache
          go clean -cache

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build application
        env:
          CGO_ENABLED: 1
          GOWORK: off
        run: wails build -platform windows/amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrSyncPlayer-Windows
          path: build/bin/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            build-essential \
            libappindicator3-dev \
            librsvg2-dev

      - name: Install Wails CLI
        env:
          CGO_ENABLED: 1
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Download Go modules
        run: go mod download

      - name: Clean Go cache
        run: |
          go clean -modcache
          go clean -cache

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build application
        env:
          CGO_ENABLED: 1
          GOWORK: off
        run: wails build -platform linux/amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrSyncPlayer-Linux
          path: build/bin/TorrSyncPlayer

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Xcode Command Line Tools
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install Wails CLI
        env:
          CGO_ENABLED: 1
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Download Go modules
        run: go mod download

      - name: Clean Go cache
        run: |
          go clean -modcache
          go clean -cache

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build application
        env:
          CGO_ENABLED: 1
          GOWORK: off
        run: wails build -platform darwin/amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrSyncPlayer-macOS
          path: build/bin/TorrSyncPlayer.app
