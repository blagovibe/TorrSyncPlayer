name: Build and Release TorrSyncPlayer

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: 20

jobs:
  checks:
    name: Client checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

      - name: Web build
        run: npm run build

  build:
    name: Tauri ${{ matrix.artifact_name }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: TorrSyncPlayer-AppImage
            build_command: npx tauri build --bundles appimage --ci
            artifact_path: client/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            artifact_name: TorrSyncPlayer-Portable-EXE
            build_command: npx tauri build --no-bundle --ci
            artifact_path: client/src-tauri/target/release/client.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for AppImage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          WEBKIT_PKG="libwebkit2gtk-4.1-dev"
          JSC_PKG="libjavascriptcoregtk-4.1-dev"
          SOUP_PKG="libsoup-3.0-dev"
          if ! apt-cache show "$WEBKIT_PKG" >/dev/null 2>&1; then
            WEBKIT_PKG="libwebkit2gtk-4.0-dev"
            JSC_PKG="libjavascriptcoregtk-4.0-dev"
            SOUP_PKG="libsoup2.4-dev"
          fi
          sudo apt-get install -y \
            libgtk-3-dev \
            "$WEBKIT_PKG" \
            "$JSC_PKG" \
            "$SOUP_PKG" \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri artifact
        run: ${{ matrix.build_command }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: TorrSyncPlayer-AppImage
          path: artifacts/linux

      - name: Download portable EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: TorrSyncPlayer-Portable-EXE
          path: artifacts/windows

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/linux/*.AppImage
            artifacts/windows/*.exe
