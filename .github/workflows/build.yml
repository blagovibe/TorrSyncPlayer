name: Build and Release TorrSyncPlayer

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: 24

jobs:
  checks:
    name: Client checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

      - name: Web build
        run: npm run build

  build:
    name: Tauri ${{ matrix.artifact_name }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: TorrSyncPlayer-Linux-AppImage
            build_command: npm run tauri:build:linux
            artifact_path: client/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri artifact
        run: ${{ matrix.build_command }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag
        run: |
          RELEASE_TAG="push-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Automated release for ${{ github.sha }}"
          git push origin "$RELEASE_TAG"

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: TorrSyncPlayer-Linux-AppImage
          path: artifacts/linux

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            artifacts/linux/*.AppImage
