[package]
name = "torrsyncplayer"
version = "0.1.11"
description = "A desktop app for streaming video via WebTorrent with sync"
authors = ["TorrSyncPlayer Team"]
edition = "2021"

[lib]
name = "torrsyncplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
