basePath: /api/v1
definitions:
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.AddTorrentRequest:
    properties:
      magnetUri:
        type: string
      torrentFile:
        description: base64 encoded torrent file content
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.UserResponse'
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.BufferInfo:
    properties:
      buffer_end:
        description: Buffer end
        type: integer
      buffer_size:
        description: Buffer size
        type: integer
      buffer_start:
        description: Buffer start
        type: integer
      buffered_bytes:
        description: Bytes buffered
        type: integer
      buffered_percent:
        description: Buffer load percentage
        type: number
      current_position:
        description: Current position in bytes
        type: integer
      download_speed:
        description: Download speed (bytes/sec)
        type: integer
      file_index:
        type: integer
      is_buffering:
        description: Is buffering in progress
        type: boolean
      torrent_id:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ChangePasswordRequest:
    properties:
      currentPassword:
        type: string
      newPassword:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.CreateRoomRequest:
    properties:
      name:
        type: string
      password:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.FileInfo:
    properties:
      index:
        type: integer
      name:
        type: string
      size:
        type: integer
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.FileListResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.FileInfo'
        type: array
      hasMore:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      totalCount:
        type: integer
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.JoinRoomRequest:
    properties:
      password:
        type: string
      roomId:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.RegisterRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.RoomInfo:
    properties:
      hostId:
        description: |-
          HostID is the host's peer (session) identifier, NOT the host's user ID.
          The host's user ID is tracked separately server-side (HostUserID in the
          p2p service room struct) and is the authoritative key for host checks.
        type: string
      id:
        type: string
      name:
        type: string
      peerCount:
        type: integer
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SeekRequest:
    properties:
      position:
        type: number
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SelectFileRequest:
    properties:
      fileIndex:
        type: integer
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SetBufferPositionRequest:
    properties:
      position:
        description: Position in bytes
        type: integer
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SignalRequest:
    properties:
      roomId:
        type: string
      signal:
        items:
          type: integer
        type: array
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.StreamTicketResponse:
    properties:
      ticket:
        type: string
      torrentId:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SyncStatus:
    properties:
      duration:
        type: number
      isPlaying:
        type: boolean
      position:
        type: number
      timestamp:
        type: integer
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.TorrentInfo:
    properties:
      id:
        type: string
      name:
        type: string
      progress:
        type: number
      size:
        type: integer
      status:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.TorrentListResponse:
    properties:
      hasMore:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      torrents:
        items:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.TorrentInfo'
        type: array
      totalCount:
        type: integer
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.UserResponse:
    properties:
      createdAt:
        type: integer
      id:
        type: string
      username:
        type: string
    type: object
host: localhost:8889
info:
  contact:
    email: support@torrsyncplayer.local
    name: TorrSyncPlayer Support
    url: https://github.com/blagovibe/TorrSyncPlayer/issues
  description: HTTP API for TorrSyncPlayer — torrent player with P2P playback synchronization.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/blagovibe/TorrSyncPlayer
  title: TorrSyncPlayer API
  version: "1.0"
paths:
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Changes the current user's password
      parameters:
      - description: Password change data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Change password
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates the user and returns a JWT token
      parameters:
      - description: Login data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Revokes the JWT token (adds to revoked list)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Registers a new user and returns a JWT token
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Registration
      tags:
      - auth
  /api/v1/health:
    get:
      description: Basic server health check (does not require authentication)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /api/v1/rooms:
    post:
      consumes:
      - application/json
      description: Creates a new P2P room for playback synchronization
      parameters:
      - description: Room data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.CreateRoomRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.RoomInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Create room
      tags:
      - rooms
  /api/v1/rooms/{roomID}/events:
    get:
      description: Subscribe to P2P room events in real-time via Server-Sent Events
      parameters:
      - description: Room ID
        in: path
        name: roomID
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Room events (SSE)
      tags:
      - rooms
  /api/v1/rooms/join:
    post:
      consumes:
      - application/json
      description: Joins a user to an existing P2P room
      parameters:
      - description: Login data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.JoinRoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Join room
      tags:
      - rooms
  /api/v1/rooms/leave:
    post:
      description: Leaves the current P2P room
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Leave room
      tags:
      - rooms
  /api/v1/rooms/signal:
    post:
      consumes:
      - application/json
      description: Relays a sync signal (arbitrary JSON payload) to all peers in the
        room via the server-brokered SSE stream
      parameters:
      - description: Sync signal
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SignalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Send room sync signal
      tags:
      - rooms
  /api/v1/sync/pause:
    post:
      description: Pauses synchronized playback
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SyncStatus'
      summary: Pause playback
      tags:
      - sync
  /api/v1/sync/play:
    post:
      description: Starts synchronized playback
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SyncStatus'
      summary: Start playback
      tags:
      - sync
  /api/v1/sync/seek:
    post:
      consumes:
      - application/json
      description: Performs synchronized seek to the specified position
      parameters:
      - description: Seek position
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SeekRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SyncStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Seek
      tags:
      - sync
  /api/v1/sync/status:
    get:
      description: Returns the current synchronization status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SyncStatus'
      summary: Sync status
      tags:
      - sync
  /api/v1/torrents:
    get:
      description: Returns a list of all torrents with pagination
      parameters:
      - default: 20
        description: Record limit
        in: query
        maximum: 100
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.TorrentListResponse'
      summary: List torrents
      tags:
      - torrents
    post:
      consumes:
      - application/json
      description: Adds a torrent via magnet link or torrent file and returns its
        information
      parameters:
      - description: Magnet URI or Torrent File (base64)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.AddTorrentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.TorrentInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Add torrent
      tags:
      - torrents
  /api/v1/torrents/{id}:
    delete:
      description: Removes a torrent by its ID
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Remove torrent
      tags:
      - torrents
  /api/v1/torrents/{id}/buffer/info:
    get:
      description: Returns buffer state information for the torrent
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.BufferInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Buffer info
      tags:
      - torrents
  /api/v1/torrents/{id}/buffer/position:
    post:
      consumes:
      - application/json
      description: Sets the current playback position for buffer optimization
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      - description: Position in bytes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SetBufferPositionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Set buffer position
      tags:
      - torrents
  /api/v1/torrents/{id}/files:
    get:
      description: Returns a list of torrent files with pagination
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      - default: 20
        description: Record limit
        in: query
        maximum: 100
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.FileListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: List torrent files
      tags:
      - torrents
  /api/v1/torrents/{id}/select:
    post:
      consumes:
      - application/json
      description: Selects a torrent file for streaming by index
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      - description: File index
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SelectFileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Select file for streaming
      tags:
      - torrents
  /api/v1/torrents/{id}/stream:
    get:
      description: Streams the selected torrent file with Range request support
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Stream file
      tags:
      - torrents
  /api/v1/torrents/{id}/stream-ticket:
    post:
      description: Returns a signed ticket authorizing streaming of the given torrent
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.StreamTicketResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Issue stream ticket
      tags:
      - torrents
securityDefinitions:
  BearerAuth:
    description: 'Enter JWT token in the format: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
