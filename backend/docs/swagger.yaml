basePath: /api/v1
definitions:
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.AddTorrentRequest:
    properties:
      magnetUri:
        type: string
      torrentFile:
        description: base64 encoded torrent file content
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.BufferInfo:
    properties:
      buffer_end:
        description: Buffer end
        type: integer
      buffer_size:
        description: Buffer size
        type: integer
      buffer_start:
        description: Buffer start
        type: integer
      buffered_bytes:
        description: Bytes buffered
        type: integer
      buffered_percent:
        description: Buffer load percentage
        type: number
      current_position:
        description: Current position in bytes
        type: integer
      download_speed:
        description: Download speed (bytes/sec)
        type: integer
      file_index:
        type: integer
      is_buffering:
        description: Is buffering in progress
        type: boolean
      torrent_id:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.FileInfo:
    properties:
      index:
        type: integer
      name:
        type: string
      size:
        type: integer
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.FileListResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.FileInfo'
        type: array
      hasMore:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      totalCount:
        type: integer
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.MagnetResponse:
    properties:
      magnetUri:
        example: magnet:?xt=urn:btih:3b2b1a9c
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SelectFileRequest:
    properties:
      fileIndex:
        type: integer
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SetBufferPositionRequest:
    properties:
      position:
        description: Position in bytes
        type: integer
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.TorrentInfo:
    properties:
      id:
        type: string
      name:
        type: string
      peers:
        type: integer
      progress:
        type: number
      size:
        type: integer
      status:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.TorrentListResponse:
    properties:
      hasMore:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      torrents:
        items:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.TorrentInfo'
        type: array
      totalCount:
        type: integer
    type: object
host: localhost:8889
info:
  contact:
    email: support@torrsyncplayer.local
    name: TorrSyncPlayer Support
    url: https://github.com/blagovibe/TorrSyncPlayer/issues
  description: HTTP API for TorrSyncPlayer — torrent player with P2P playback synchronization.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/blagovibe/TorrSyncPlayer
  title: TorrSyncPlayer API
  version: "1.0"
paths:
  /api/v1/health:
    get:
      description: Basic server health check (does not require authentication)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /api/v1/torrents:
    get:
      description: Returns a list of all torrents with pagination
      parameters:
      - default: 20
        description: Record limit
        in: query
        maximum: 100
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.TorrentListResponse'
      summary: List torrents
      tags:
      - torrents
    post:
      consumes:
      - application/json
      description: Adds a torrent via magnet link or torrent file and returns its
        information
      parameters:
      - description: Magnet URI or Torrent File (base64)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.AddTorrentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.TorrentInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Add torrent
      tags:
      - torrents
  /api/v1/torrents/{id}:
    delete:
      description: Removes a torrent by its ID
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Remove torrent
      tags:
      - torrents
  /api/v1/torrents/{id}/buffer/info:
    get:
      description: Returns buffer state information for the torrent
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.BufferInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Buffer info
      tags:
      - torrents
  /api/v1/torrents/{id}/buffer/position:
    post:
      consumes:
      - application/json
      description: Sets the current playback position for buffer optimization
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      - description: Position in bytes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SetBufferPositionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Set buffer position
      tags:
      - torrents
  /api/v1/torrents/{id}/files:
    get:
      description: Returns a list of torrent files with pagination
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      - default: 20
        description: Record limit
        in: query
        maximum: 100
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.FileListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: List torrent files
      tags:
      - torrents
  /api/v1/torrents/{id}/magnet:
    get:
      description: Returns the magnet URI for a torrent the caller holds
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.MagnetResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Get torrent magnet
      tags:
      - torrents
  /api/v1/torrents/{id}/select:
    post:
      consumes:
      - application/json
      description: Selects a torrent file for streaming by index (per-peer)
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      - description: File index
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SelectFileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Select file for streaming
      tags:
      - torrents
  /api/v1/torrents/{id}/stream:
    get:
      description: Streams the selected torrent file with Range request support (per-peer)
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Stream file
      tags:
      - torrents
  /api/v1/torrents/{id}/subtitles/{fileIndex}/{fileName}:
    get:
      description: Serves one torrent file by index for mpv --sub-file, with the ordinary
        access-token header and room-scoped read access. The trailing file name is
        for mpv's format detection and is ignored.
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      - description: File index within the torrent
        in: path
        name: fileIndex
        required: true
        type: integer
      - description: File name, repeated for mpv's format detection
        in: path
        name: fileName
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Fetch subtitles
      tags:
      - torrents
securityDefinitions:
  BearerAuth:
    description: The access token printed by the server at startup. Same value for
      every friend; it changes on restart.
    in: header
    name: X-Access-Token
    type: apiKey
swagger: "2.0"
