basePath: /api/v1
definitions:
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.AddTorrentRequest:
    properties:
      magnetUri:
        type: string
      torrentFile:
        description: base64 encoded torrent file content
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.BufferInfo:
    properties:
      buffer_end:
        description: Buffer end
        type: integer
      buffer_size:
        description: Buffer size
        type: integer
      buffer_start:
        description: Buffer start
        type: integer
      buffered_bytes:
        description: Bytes buffered
        type: integer
      buffered_percent:
        description: Buffer load percentage
        type: number
      current_position:
        description: Current position in bytes
        type: integer
      download_speed:
        description: Download speed (bytes/sec)
        type: integer
      file_index:
        type: integer
      is_buffering:
        description: Is buffering in progress
        type: boolean
      torrent_id:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.BufferingRequest:
    properties:
      buffering:
        type: boolean
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.CreateRoomRequest:
    properties:
      name:
        type: string
      password:
        type: string
      torrentId:
        description: infohash of the torrent to bind this room to
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.FileInfo:
    properties:
      index:
        type: integer
      name:
        type: string
      size:
        type: integer
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.FileListResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.FileInfo'
        type: array
      hasMore:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      totalCount:
        type: integer
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.JoinRoomRequest:
    properties:
      password:
        type: string
      roomId:
        type: string
      torrentId:
        description: must match room's torrent (idea-0046)
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.JoinRoomResponse:
    properties:
      id:
        type: string
      message:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.P2PEvent:
    properties:
      data: {}
      seq:
        description: |-
          Seq is the sequence number of this event within its room.
          Clients use it to detect gaps and request replay.
        type: integer
      type:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.PeerInfo:
    properties:
      buffering:
        description: |-
          Buffering reports that this peer last said it was out of data. It is
          sticky until the peer says otherwise, so a peer that vanishes without
          saying is dropped from the roster instead.
        example: false
        type: boolean
      isHost:
        description: IsHost marks the room's host, who controls play/pause/seek.
        example: false
        type: boolean
      peerID:
        description: |-
          PeerID is the session identifier of this participant. It changes on
          reconnect; UserID does not.
        example: peer-abc
        type: string
      userID:
        example: user-1
        type: string
      username:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.RoomInfo:
    properties:
      hostId:
        type: string
      hostUserId:
        type: string
      id:
        type: string
      name:
        type: string
      peerCount:
        example: 2
        type: integer
      peers:
        items:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.PeerInfo'
        type: array
      rosterSeq:
        type: integer
      torrentId:
        description: infohash of the torrent bound to this room
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SeekRequest:
    properties:
      position:
        type: number
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SelectFileRequest:
    properties:
      fileIndex:
        type: integer
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SetBufferPositionRequest:
    properties:
      position:
        description: Position in bytes
        type: integer
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SignalRequest:
    properties:
      roomId:
        type: string
      signal:
        items:
          type: integer
        type: array
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.StreamTicketResponse:
    properties:
      ticket:
        type: string
      torrentId:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SyncStatus:
    properties:
      buffering:
        type: boolean
      duration:
        type: number
      isPlaying:
        type: boolean
      position:
        type: number
      timestamp:
        type: integer
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.TorrentInfo:
    properties:
      id:
        type: string
      name:
        type: string
      progress:
        type: number
      size:
        type: integer
      status:
        type: string
    type: object
  github_com_blagovibe_TorrSyncPlayer_backend_internal_models.TorrentListResponse:
    properties:
      hasMore:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      torrents:
        items:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.TorrentInfo'
        type: array
      totalCount:
        type: integer
    type: object
host: localhost:8889
info:
  contact:
    email: support@torrsyncplayer.local
    name: TorrSyncPlayer Support
    url: https://github.com/blagovibe/TorrSyncPlayer/issues
  description: HTTP API for TorrSyncPlayer — torrent player with P2P playback synchronization.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/blagovibe/TorrSyncPlayer
  title: TorrSyncPlayer API
  version: "1.0"
paths:
  /api/v1/health:
    get:
      description: Basic server health check (does not require authentication)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /api/v1/rooms:
    post:
      consumes:
      - application/json
      description: Creates a new P2P room for playback synchronization bound to a
        torrent
      parameters:
      - description: Room data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.CreateRoomRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.RoomInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Create room
      tags:
      - rooms
  /api/v1/rooms/{roomID}/events:
    get:
      description: 'Subscribe to P2P room events in real-time via Server-Sent Events.
        Each `data:` frame is a P2PEvent whose `type` selects the payload shape: `peer_joined`
        is {peerID, userID, isHost, peerCount}; `peer_left` is {peerID, userID, peerCount};
        `peer_list` is {peers: [{peerID, userID, username?, isHost, buffering}]} and
        replaces the whole roster rather than describing one change; `sync` is {action,
        status, initiator} plus a top-level `position` on seek and a top-level `buffering`
        on buffering reports; `signal` is an opaque blob relayed verbatim. The two
        positions on a seek differ on purpose: the top-level `position` is where the
        host asked to go, `status.position` is where smoothing actually moved the
        room. `data` appears as an untyped object because the payloads form a union
        selected by `type`; the shapes are listed here and defined in internal/models/events.go.'
      parameters:
      - description: Room ID
        in: path
        name: roomID
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.P2PEvent'
      summary: Room events (SSE)
      tags:
      - rooms
  /api/v1/rooms/info:
    get:
      description: 'Returns the caller''s current room: id, name, host, peer count
        and the full roster. `peerCount` counts PARTICIPANTS including the host. `peers`
        is the authoritative roster snapshot and is what lets a client that joined
        late learn about peers whose `peer_joined` events it never saw; each entry
        carries `peerID`, `userID`, optional `username`, `isHost` and `buffering`.
        There is deliberately no per-peer "in sync" flag: the room shares one playback
        position, so the server cannot know how far any individual peer has drifted.
        Resolved from the caller''s own membership, so a peer outside any room gets
        400.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.RoomInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Room info
      tags:
      - rooms
  /api/v1/rooms/join:
    post:
      consumes:
      - application/json
      description: Joins a user to an existing P2P room (must match torrentId)
      parameters:
      - description: Login data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.JoinRoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.JoinRoomResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Join room
      tags:
      - rooms
  /api/v1/rooms/leave:
    post:
      description: Leaves the current P2P room
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Leave room
      tags:
      - rooms
  /api/v1/rooms/signal:
    post:
      consumes:
      - application/json
      description: Relays a sync signal (arbitrary JSON payload) to all peers in the
        room via the server-brokered SSE stream
      parameters:
      - description: Sync signal
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SignalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Send room sync signal
      tags:
      - rooms
  /api/v1/sync/buffering:
    post:
      consumes:
      - application/json
      description: Reports that the calling peer started or stopped buffering, so
        the room pauses/resumes with it. Any room member may report it; a peer not
        in a room gets 400.
      parameters:
      - description: Buffering state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.BufferingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SyncStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Report buffering state
      tags:
      - sync
  /api/v1/sync/pause:
    post:
      description: Pauses synchronized playback (host only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SyncStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Pause playback
      tags:
      - sync
  /api/v1/sync/play:
    post:
      description: Starts synchronized playback (host only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SyncStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Start playback
      tags:
      - sync
  /api/v1/sync/seek:
    post:
      consumes:
      - application/json
      description: Performs synchronized seek to the specified position (host only)
      parameters:
      - description: Seek position
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SeekRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SyncStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Seek
      tags:
      - sync
  /api/v1/sync/status:
    get:
      description: Returns the current synchronization status of the caller's room.
        A caller outside any room gets 400.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SyncStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Sync status
      tags:
      - sync
  /api/v1/torrents:
    get:
      description: Returns a list of all torrents with pagination
      parameters:
      - default: 20
        description: Record limit
        in: query
        maximum: 100
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.TorrentListResponse'
      summary: List torrents
      tags:
      - torrents
    post:
      consumes:
      - application/json
      description: Adds a torrent via magnet link or torrent file and returns its
        information
      parameters:
      - description: Magnet URI or Torrent File (base64)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.AddTorrentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.TorrentInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Add torrent
      tags:
      - torrents
  /api/v1/torrents/{id}:
    delete:
      description: Removes a torrent by its ID
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Remove torrent
      tags:
      - torrents
  /api/v1/torrents/{id}/buffer/info:
    get:
      description: Returns buffer state information for the torrent
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.BufferInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Buffer info
      tags:
      - torrents
  /api/v1/torrents/{id}/buffer/position:
    post:
      consumes:
      - application/json
      description: Sets the current playback position for buffer optimization
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      - description: Position in bytes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SetBufferPositionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Set buffer position
      tags:
      - torrents
  /api/v1/torrents/{id}/files:
    get:
      description: Returns a list of torrent files with pagination
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      - default: 20
        description: Record limit
        in: query
        maximum: 100
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.FileListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: List torrent files
      tags:
      - torrents
  /api/v1/torrents/{id}/select:
    post:
      consumes:
      - application/json
      description: Selects a torrent file for streaming by index (per-peer)
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      - description: File index
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SelectFileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Select file for streaming
      tags:
      - torrents
  /api/v1/torrents/{id}/stream:
    get:
      description: Streams the selected torrent file with Range request support (per-peer)
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Stream file
      tags:
      - torrents
  /api/v1/torrents/{id}/stream-ticket:
    post:
      description: Returns a signed ticket authorizing streaming of the given torrent
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.StreamTicketResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_blagovibe_TorrSyncPlayer_backend_internal_models.ErrorResponse'
      summary: Issue stream ticket
      tags:
      - torrents
securityDefinitions:
  BearerAuth:
    description: The access token printed by the server at startup. Same value for
      every friend; it changes on restart.
    in: header
    name: X-Access-Token
    type: apiKey
swagger: "2.0"
