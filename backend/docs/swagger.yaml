basePath: /api/v1
definitions:
  api.APIError:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  models.AddTorrentRequest:
    properties:
      magnetUri:
        type: string
    type: object
  models.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  models.BufferInfoResponse:
    properties:
      position:
        type: number
      buffered:
        type: number
      bufferSize:
        type: integer
    type: object
  models.BufferPositionRequest:
    properties:
      position:
        type: number
    type: object
  models.CreateRoomRequest:
    properties:
      name:
        type: string
      password:
        type: string
    type: object
  models.CSRFTokenResponse:
    properties:
      csrfToken:
        type: string
    type: object
  models.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  models.FileInfo:
    properties:
      index:
        type: integer
      name:
        type: string
      size:
        type: integer
    type: object
  models.FileListResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/models.FileInfo'
        type: array
      hasMore:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      totalCount:
        type: integer
    type: object
  models.HealthResponse:
    properties:
      status:
        type: string
      uptime:
        type: number
      version:
        type: string
    type: object
  models.JoinRoomRequest:
    properties:
      password:
        type: string
      roomId:
        type: string
    type: object
  models.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  models.RegisterRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  models.RoomInfo:
    properties:
      hostId:
        type: string
      id:
        type: string
      name:
        type: string
      peerCount:
        type: integer
    type: object
  models.SeekRequest:
    properties:
      position:
        type: number
    type: object
  models.SelectFileRequest:
    properties:
      fileIndex:
        type: integer
    type: object
  models.SignalRequest:
    properties:
      roomId:
        type: string
      signal:
        items:
          type: integer
        type: array
    type: object
  models.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  models.SyncStatus:
    properties:
      duration:
        type: number
      isPlaying:
        type: boolean
      position:
        type: number
      timestamp:
        type: integer
    type: object
  models.TorrentInfo:
    properties:
      id:
        type: string
      name:
        type: string
      progress:
        type: number
      size:
        type: integer
      status:
        type: string
    type: object
  models.TorrentListResponse:
    properties:
      hasMore:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      torrents:
        items:
          $ref: '#/definitions/models.TorrentInfo'
        type: array
      totalCount:
        type: integer
    type: object
  models.User:
    properties:
      createdAt:
        type: integer
      id:
        type: string
      username:
        type: string
    type: object
  models.VersionResponse:
    properties:
      version:
        type: string
      commit:
        type: string
      buildTime:
        type: string
    type: object
host: localhost:8889
info:
  contact:
    email: support@torrsyncplayer.local
    name: TorrSyncPlayer Support
    url: https://github.com/blagovibe/TorrSyncPlayer/issues
  description: HTTP API for TorrSyncPlayer — a torrent player with P2P playback synchronization.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/blagovibe/TorrSyncPlayer
  title: TorrSyncPlayer API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Revokes a JWT token (adds to the revoked list)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Registers a new user and returns a JWT token
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Register
      tags:
      - auth
  /api/v1/csrf-token:
    get:
      description: Returns a CSRF token for protection against cross-site request forgery
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CSRFTokenResponse'
      summary: Get CSRF token
      tags:
      - system
  /api/v1/health:
    get:
      description: Basic server health check (does not require authentication)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.HealthResponse'
      summary: Health check
      tags:
      - system
  /api/v1/health/detailed:
    get:
      description: Detailed health check with service status verification (requires JWT)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.HealthResponse'
      security:
      - BearerAuth: []
      summary: Detailed health check
      tags:
      - system
  /api/v1/rooms:
    post:
      consumes:
      - application/json
      description: Creates a new P2P room for playback synchronization
      parameters:
      - description: Room data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateRoomRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.RoomInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
      security:
      - BearerAuth: []
      summary: Create room
      tags:
      - rooms
  /api/v1/rooms/{roomID}/events:
    get:
      description: Subscribes to real-time P2P room events via Server-Sent
        Events
      parameters:
      - description: Room ID
        in: path
        name: roomID
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Room events (SSE)
      tags:
      - rooms
  /api/v1/rooms/join:
    post:
      consumes:
      - application/json
      description: Joins an existing P2P room
      parameters:
      - description: Join room data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.JoinRoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
      security:
      - BearerAuth: []
      summary: Join room
      tags:
      - rooms
  /api/v1/rooms/leave:
    post:
      description: Leaves the current P2P room
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
      security:
      - BearerAuth: []
      summary: Leave room
      tags:
      - rooms
  /api/v1/rooms/signal:
    post:
      consumes:
      - application/json
      description: Sends a WebRTC signal (SDP offer/answer, ICE candidate) through
        the data channel
      parameters:
      - description: WebRTC signal
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SignalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
      security:
      - BearerAuth: []
      summary: Send WebRTC signal
      tags:
      - rooms
  /api/v1/sync/pause:
    post:
      description: Pauses synchronized playback
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SyncStatus'
      security:
      - BearerAuth: []
      summary: Pause playback
      tags:
      - sync
  /api/v1/sync/play:
    post:
      description: Starts synchronized playback
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SyncStatus'
      security:
      - BearerAuth: []
      summary: Start playback
      tags:
      - sync
  /api/v1/sync/seek:
    post:
      consumes:
      - application/json
      description: Performs a synchronized seek to the specified position
      parameters:
      - description: Seek position
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SeekRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SyncStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
      security:
      - BearerAuth: []
      summary: Seek
      tags:
      - sync
  /api/v1/sync/status:
    get:
      description: Returns the current playback synchronization status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SyncStatus'
      security:
      - BearerAuth: []
      summary: Sync status
      tags:
      - sync
  /api/v1/torrents:
    get:
      description: Returns a paginated list of all torrents
      parameters:
      - default: 20
        description: Record limit
        in: query
        maximum: 100
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TorrentListResponse'
      security:
      - BearerAuth: []
      summary: Torrent list
      tags:
      - torrents
    post:
      consumes:
      - application/json
      description: Adds a torrent by magnet link and returns its information
      parameters:
      - description: Magnet URI
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.AddTorrentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.TorrentInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.APIError'
      security:
      - BearerAuth: []
      summary: Add torrent
      tags:
      - torrents
  /api/v1/torrents/{id}:
    delete:
      description: Deletes a torrent by its ID
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      security:
      - BearerAuth: []
      summary: Delete torrent
      tags:
      - torrents
  /api/v1/torrents/{id}/buffer/info:
    get:
      description: Returns information about the torrent buffer state
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BufferInfoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      security:
      - BearerAuth: []
      summary: Buffer info
      tags:
      - torrents
  /api/v1/torrents/{id}/buffer/position:
    post:
      consumes:
      - application/json
      description: Sets the buffer position for prioritized downloading
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      - description: Buffer position
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BufferPositionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
      security:
      - BearerAuth: []
      summary: Set buffer position
      tags:
      - torrents
  /api/v1/torrents/{id}/files:
    get:
      description: Returns a paginated list of torrent files
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      - default: 20
        description: Record limit
        in: query
        maximum: 100
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.FileListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      security:
      - BearerAuth: []
      summary: Torrent file list
      tags:
      - torrents
  /api/v1/torrents/{id}/select:
    post:
      consumes:
      - application/json
      description: Selects a torrent file for streaming by index
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      - description: File index
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SelectFileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
      security:
      - BearerAuth: []
      summary: Select file for streaming
      tags:
      - torrents
  /api/v1/torrents/{id}/stream:
    get:
      description: Streams the selected torrent file with Range request support
      parameters:
      - description: Torrent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.APIError'
      security:
      - BearerAuth: []
      summary: Stream file
      tags:
      - torrents
  /api/v1/version:
    get:
      description: Returns the server version, commit hash, and build time
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.VersionResponse'
      summary: Server version
      tags:
      - system
  /health:
    get:
      description: Basic server health check (does not require authentication)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.HealthResponse'
      summary: Health check
      tags:
      - system
  /metrics:
    get:
      description: Prometheus server metrics
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Prometheus metrics
      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: 'Enter JWT token in the format: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
