version: "2"
run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - bodyclose
    - gosec
    - ineffassign
    - misspell
    - revive
    - unconvert
    - unused
  exclusions:
    rules:
      - linters: [revive]
        text: "unused-parameter"
      - linters: [revive]
        text: "exported"
      - linters: [revive]
        text: "package-comments"
      - linters: [revive]
        text: "empty-block"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: github.com/blagovibe/TorrSyncPlayer
