run:
  timeout: 5m
  go: "1.26"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - staticcheck
    - bodyclose
    - gofmt
    - goimports
    - misspell
    - unconvert
    - gosec
    - ineffassign
    - revive
    - unused
  disable: []

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/blagovibe/TorrSyncPlayer

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
