groups:
  - name: torrsyncplayer
    rules:
      - alert: BackendDown
        expr: up{job="torrsyncplayer-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "TorrSyncPlayer backend is down"
          description: "Backend has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for the last 5 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "95th percentile latency is above 2 seconds."

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="torrsyncplayer-backend"} > 400 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Backend memory usage is above 400MB."
